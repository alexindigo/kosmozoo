name: Docker
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Candidate image tag, e.g. 1.4.0-rc1 (publishes only this tag)"
        required: true

jobs:
  order:
    # Is this tag the highest overall / within its major? Release tags only.
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.o.outputs.release }}
      latest: ${{ steps.o.outputs.latest }}
      major: ${{ steps.o.outputs.major }}
      major_latest: ${{ steps.o.outputs.major_latest }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, fetch-tags: true }
      - id: o
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            { echo release=false; echo latest=false; echo major_latest=false; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          dev/check-release-version.sh "$GITHUB_REF_NAME"
          t="$GITHUB_REF_NAME"; major="${t#v}"; major="${major%%.*}"
          all=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
          top=$(printf '%s\n' "$all" | tail -1)
          topmajor=$(printf '%s\n' "$all" | grep -E "^v${major}\." | tail -1)
          {
            echo release=true
            echo major="$major"
            echo "latest=$([ "$t" = "$top" ] && echo true || echo false)"
            echo "major_latest=$([ "$t" = "$topmajor" ] && [ "$major" != 0 ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  image:
    needs: order
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/alexindigo/kosmozoo
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ needs.order.outputs.release }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.order.outputs.release }}
            type=semver,pattern={{major}},enable=${{ needs.order.outputs.major_latest }}
            type=raw,value=latest,enable=${{ needs.order.outputs.latest }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64        # match the Dockerfile
          push: true
          build-args: KOZMOZOO_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: [order, image]
    if: needs.order.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## " v) == 1 && substr($0, length(v) + 4, 1) !~ /[0-9.]/ {p=1; next} p && /^## / {exit} p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG section for $v"; exit 1; }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "Kosmozoo $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
