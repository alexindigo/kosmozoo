name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64        # match the Dockerfile
          push: false
