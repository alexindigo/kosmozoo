// ---------- anchors (local only, nothing uploads) ----------
// Anchors persist in localStorage (image dataURLs + names, in pane order).
// Large images are downscaled (max 1200px, JPEG q0.85) to fit the ~5MB
// localStorage quota; on quota overflow the pane still works in-memory.

const LS_KEY = 'kosmozoo.anchors.v1';

function loadAnchorStore() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
  catch (e) { return []; }
}

function persistAnchors() {
  const items = [...anchorList.querySelectorAll('.anchor')].map(el => ({
    name: el.dataset.name,
    src: el.dataset.src,
    ...(el.dataset.meta ? { meta: JSON.parse(el.dataset.meta) } : {}),
  }));
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(items));
  } catch (e) {
    setStatus('anchors not saved: browser storage full', true);
  }
}

// ComfyUI embeds the API graph in a PNG tEXt/iTXt chunk named "prompt".
// Returns {width, height, promptGraph} or null.
function parsePngMeta(buf) {
  const dv = new DataView(buf);
  const SIG = [0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A];
  if (buf.byteLength < 8 || SIG.some((b, i) => dv.getUint8(i) !== b))
    return null;
  const dec = new TextDecoder();
  let width = 0, height = 0, promptGraph = null;
  let off = 8;
  while (off + 12 <= buf.byteLength) {
    const len = dv.getUint32(off);
    const type = dec.decode(new Uint8Array(buf, off + 4, 4));
    const data = new Uint8Array(buf, off + 8, len);
    if (type === 'IHDR') {
      width = dv.getUint32(off + 8);
      height = dv.getUint32(off + 12);
    } else if (type === 'tEXt' || type === 'iTXt') {
      const nul = data.indexOf(0);
      if (nul > 0) {
        const keyword = dec.decode(data.subarray(0, nul));
        if (keyword === 'prompt') {
          if (type === 'tEXt') {
            try { promptGraph = JSON.parse(dec.decode(data.subarray(nul + 1))); }
            catch (e) { /* keep looking */ }
          } else {
            // iTXt: keyword\0 compFlag compMethod lang\0 translated\0 text
            const compFlag = data[nul + 1];
            if (compFlag === 0) {
              let p = nul + 4;
              p += data.indexOf(0, p) - p + 1;
              p += data.indexOf(0, p) - p + 1;
              try { promptGraph = JSON.parse(dec.decode(data.subarray(p))); }
              catch (e) { /* keep looking */ }
            }
          }
        }
      }
    }
    off += 12 + len;
    if (type === 'IEND') break;
  }
  return promptGraph ? { width, height, promptGraph } : null;
}

// Same extraction as candidates: history entry shape -> reuse extractMeta.
function metaFromPng(pngMeta) {
  const m = extractMeta({ prompt: [0, '', pngMeta.promptGraph] });
  if (m && pngMeta.width && pngMeta.height) {
    m.width = pngMeta.width;
    m.height = pngMeta.height;
  }
  return m;
}

function fillAnchorMeta(el, meta) {
  const bits = [];
  if (meta.seed !== undefined) bits.push(`seed ${meta.seed}`);
  if (meta.steps !== undefined) bits.push(`${meta.steps} steps`);
  if (meta.cfg !== undefined) bits.push(`cfg ${meta.cfg}`);
  if (meta.denoise !== undefined) bits.push(`dn ${Number(meta.denoise).toFixed(2)}`);
  if (meta.sampler_name)
    bits.push(meta.scheduler ? `${meta.sampler_name}/${meta.scheduler}`
                             : meta.sampler_name);
  for (const l of meta.loras || [])
    bits.push(`${l.name}${l.strength != null ? '@' + l.strength : ''}`);
  if (meta.width && meta.height) bits.push(`${meta.width}×${meta.height}`);
  const pair = document.createElement('div');
  pair.className = 'pair';
  const props = document.createElement('div');
  props.className = 'props';
  props.textContent = bits.join(' · ');
  const desc = document.createElement('div');
  desc.className = 'desc';
  if (meta.prompt) {
    desc.textContent = meta.prompt.length > 200
      ? meta.prompt.slice(0, 200) + '…' : meta.prompt;
    desc.title = meta.prompt;
  }
  pair.append(props, desc);
  el.appendChild(pair);
  el.style.display = 'block';
}

// Downscale via canvas so persisted anchors fit the storage quota.
function shrinkImage(src, fileName) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1200;
      if (Math.max(img.width, img.height) <= MAX) return resolve(src);
      const scale = MAX / Math.max(img.width, img.height);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve(/\.png$/i.test(fileName)
        ? c.toDataURL('image/png')
        : c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => resolve(src);
    img.src = src;
  });
}

function renderAnchor(name, src, meta) {
  const wrap = document.createElement('div');
  wrap.className = 'anchor';
  wrap.dataset.name = name;
  wrap.dataset.src = src;
  if (meta) wrap.dataset.meta = JSON.stringify(meta);
  const img = document.createElement('img');
  img.src = src;
  img.style.cursor = 'zoom-in';
  img.addEventListener('click', () => openLightbox(src, img));
  // Live pinch-zoom works in the pane, but the thumbnail never LOADS zoomed
  // (a restored crop leaves a gap and detaches the ×). Lightbox write-backs
  // update state+store while keeping the thumbnail visually unzoomed.
  const anchorZoomKey = `anchor:${name}`;
  makeZoomable(img, { zoomKey: anchorZoomKey,
                      onZoomChange: (z) => { wrap.draggable = !z; } });
  const storedZoom = zoomStore[anchorZoomKey];
  if (storedZoom)   // seed state for lightbox carry only — no transform
    img._zoomState = { s: storedZoom.s, txf: storedZoom.txf || 0,
                       tyf: storedZoom.tyf || 0, fh: !!storedZoom.fh,
                       fv: !!storedZoom.fv, rot: storedZoom.rot || 0 };
  const origSetZoom = img._setZoom;
  img._setZoom = (z) => {
    origSetZoom(z);                       // sync internals + persist
    img.style.transform = '';             // ...but keep the thumbnail clean
    img.classList.remove('zoomed');
    wrap.draggable = true;
  };
  const imgWrap = document.createElement('div');
  imgWrap.className = 'aimgwrap';
  imgWrap.appendChild(img);
  const nameEl = document.createElement('div');
  nameEl.className = 'aname';
  nameEl.textContent = name;
  const metaEl = document.createElement('div');
  metaEl.className = 'ameta';
  if (meta) fillAnchorMeta(metaEl, meta);
    const rm = document.createElement('button');
  rm.className = 'rm';
  rm.textContent = '×';
  rm.title = 'remove anchor';
  rm.addEventListener('click', () => { wrap.remove(); persistAnchors(); });
  imgWrap.appendChild(rm);   // semi-transparent overlay on the image itself
  wrap.append(imgWrap, nameEl, metaEl);
  anchorList.appendChild(wrap);

  // drag-and-drop reordering (distinguished from file drops:
  // internal drags carry no files, only our own type marker)
  wrap.draggable = true;
  wrap.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/x-anchor', '');
    e.dataTransfer.effectAllowed = 'move';
    anchorDragEl = wrap;
    wrap.classList.add('dragging');
  });
  wrap.addEventListener('dragend', () => {
    wrap.classList.remove('dragging');
    anchorDragEl = null;
    persistAnchors();
  });
}

async function addAnchor(file) {
  if (!file.type.startsWith('image/')) return;
  const [src, buf] = await Promise.all([
    new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(file);
    }),
    file.arrayBuffer(),
  ]);
  if (!src) return;
  let meta = null;
  try {
    const pngMeta = parsePngMeta(buf);   // from ORIGINAL bytes (before shrink)
    if (pngMeta) meta = metaFromPng(pngMeta);
  } catch (e) { /* metadata optional */ }
  renderAnchor(file.name, await shrinkImage(src, file.name), meta);
  persistAnchors();
}

let anchorDragEl = null;

anchorList.addEventListener('dragover', (e) => {
  if (!anchorDragEl) return;               // external file drag: ignore here
  e.preventDefault();                      // allow drop
  e.dataTransfer.dropEffect = 'move';
  const over = e.target.closest('.anchor');
  if (!over || over === anchorDragEl) return;
  const rect = over.getBoundingClientRect();
  const before = (e.clientY - rect.top) < rect.height / 2;
  anchorList.insertBefore(anchorDragEl, before ? over : over.nextSibling);
});
anchorList.addEventListener('drop', (e) => {
  if (anchorDragEl) e.preventDefault();    // reorder done in dragover
});

dropzone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropzone.classList.add('over');
});
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('over'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('over');
  if (anchorDragEl) return;                // was an anchor reorder, not files
  for (const f of e.dataTransfer.files) addAnchor(f);
});
dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  for (const f of fileInput.files) addAnchor(f);
  fileInput.value = '';
});

// ---------- hosts + init ----------

// Reachability is advisory, not a gate: offline hosts stay selectable
// (ComfyUI stalls its API while generating, so a failed probe is often
// transient). Every refresh re-probes.
async function refreshHosts() {
  const hosts = await api('/api/hosts');
  if (!(currentHost && hosts.some(h => h.name === currentHost)))
    currentHost = (hosts.find(h => h.online) || hosts[0] || {}).name || null;
  renderHostPicker(hosts);
  if (!hosts.some(h => h.online)) setStatus('all hosts offline', true);
}

// Collapsed state: status dot + current host name. Open state: one row per
// host (click to select, × to remove) + the add-host row at the bottom.
function renderHostPicker(hosts) {
  const cur = hosts.find(h => h.name === currentHost);
  $('hostBtnLabel').textContent = currentHost || 'no hosts';
  $('hostDot').classList.toggle('off', !(cur && cur.online));
  const list = $('hostList');
  list.innerHTML = '';
  for (const h of hosts) {
    const row = document.createElement('div');
    row.className = 'hostpick' + (h.name === currentHost ? ' current' : '') +
                    (h.online ? '' : ' off');
    row.title = `${h.name} — ${h.address}` + (h.online ? '' : ' (offline)');
    const dot = document.createElement('span');
    dot.className = 'hdot' + (h.online ? '' : ' off');
    dot.style.cssText =
      'width:7px;height:7px;border-radius:50%;flex:0 0 auto;' +
      `background:var(--${h.online ? 'accent' : 'dim'})`;
    const name = document.createElement('span');
    name.className = 'hname';
    name.textContent = h.name;
    const addr = document.createElement('span');
    addr.className = 'haddr';
    addr.textContent = h.address + (h.online ? '' : ' · offline');
    const rm = document.createElement('button');
    rm.className = 'rm';
    rm.textContent = '×';
    rm.title = `remove ${h.name}`;
    rm.addEventListener('click', (e) => {
      e.stopPropagation();
      removeHost(h.name);
    });
    row.append(dot, name, addr, rm);
    row.addEventListener('click', () => {
      $('hostDrop').hidden = true;
      if (h.name === currentHost) return;
      currentHost = h.name;
      renderHostPicker(hosts);
      loadCandidates();
    });
    list.appendChild(row);
  }
}

async function refresh() {
  setStatus('probing hosts…');
  try {
    await refreshHosts();
  } catch (err) {
    setStatus(`host probe failed: ${err.message}`, true);
  }
  try {
    comments = await api('/api/comments');
  } catch (err) { /* keep existing */ }
  await loadCandidates();
}

async function init() {
  const savedWidth = localStorage.getItem(LS_WIDTH);
  if (savedWidth) anchorsEl.style.width = savedWidth;
  for (const a of loadAnchorStore()) {
    if (a && a.src) renderAnchor(a.name || 'anchor', a.src, a.meta || null);
  }
  try {
    const cfg = await api('/api/config');
    bucketList = cfg.buckets || [];
  } catch (err) { /* no buckets configured */ }
  try {
    comments = await api('/api/comments');
  } catch (err) { /* start with empty */ }
  // Advanced mode gates the extra UI; restore before first render
  const adv = localStorage.getItem('kosmozoo.advanced') === '1';
  document.body.classList.toggle('advanced', adv);
  $('advToggle').checked = adv;
  $('groupBtn').classList.toggle('on', groupMode);
  await refresh();
  // face detection: restore toggles, load in the background if enabled
  $('lbAlign').checked = faceAlignOn();
  $('lbGuides').checked = guidesVisible();
  $('lbFaceBoxT').checked = faceBoxVisible();
  $('lbOverlay').checked = overlayOn();
  $('lbSplitT').checked = splitOn();
  $('lbLinked').checked = linkedOn();
  $('faceModel').value = faceModel();
  applyGuidesVisibility();
  if (faceDetectEnabled()) {
    $('faceDetectToggle').checked = true;
    enableFaceDetection();          // async; UI never blocks on it
  } else {
    faceStatus('off');
    updateFaceTogglesVisibility();
  }
}

$('hostBtn').addEventListener('click', async () => {
  const drop = $('hostDrop');
  drop.hidden = !drop.hidden;
  if (!drop.hidden) {
    try { renderHostPicker(await api('/api/hosts')); }
    catch (err) { /* leave stale */ }

});

async function saveHosts(hosts) {
  const r = await fetch('/api/config', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ hosts }),
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.status);
}

async function removeHost(name) {
  try {
    const hosts = await api('/api/hosts');
    const map = {};
    for (const h of hosts) if (h.name !== name) map[h.name] = h.address;
    await saveHosts(map);
    if (currentHost === name)
      currentHost = (hosts.find(h => h.name !== name) || {}).name || null;
    await refreshHosts();
    if (currentHost) await loadCandidates();
  } catch (err) {
    setStatus(`host remove failed: ${err.message}`, true);
  }
}

    const map = {};
    for (const h of hosts) map[h.name] = h.address;
    map[name] = addr;
    await saveHosts(map);
    $('hostName').value = '';
    $('hostAddr').value = '';
    await refreshHosts();
    setStatus(`host ${name} added`);

  try { localStorage.setItem(LS_FACEMODEL, e.target.value); } catch (err) {}
  faceDetector = null;                 // model switched: reload on demand
  if (faceLoadState !== 'off') faceLoadState = 'off';
  faceStatus('off');
  if (faceDetectEnabled()) enableFaceDetection();
  updateFaceTogglesVisibility();
});

// ---------- lightbox toggle handlers (delegate to the module) ----------

$('lbAlign').addEventListener('change', (e) => {
  const on = e.target.checked;
  try { localStorage.setItem(LS_ALIGN, on ? '1' : '0'); } catch (err) {}
  if (on && LB.isOpen() && LB.currentCol() === 'cand') alignToAnchorFace();
});

$('lbGuides').addEventListener('change', (e) => {
  try {
    localStorage.setItem(LS_GUIDES_VIS, e.target.checked ? '1' : '0');
  } catch (err) {}
  applyGuidesVisibility();
});

$('lbFaceBoxT').addEventListener('change', (e) => {
  try {
    localStorage.setItem(LS_FACEBOX_VIS, e.target.checked ? '1' : '0');
  } catch (err) {}
  updateFaceBoxOverlay();
});

$('lbOverlay').addEventListener('change', (e) => {
  try {
    localStorage.setItem(LS_OVERLAY, e.target.checked ? '1' : '0');
  } catch (err) {}
  LB.render();
});

$('lbSplitT').addEventListener('change', (e) => {
  LB.setSplitOn(e.target.checked);
});

$('lbLinked').addEventListener('change', (e) => {
  try {
    localStorage.setItem(LS_LINKED, e.target.checked ? '1' : '0');
  } catch (err) {}
  LB.render();
});

// Hide all thumbs-up images for this session (votes untouched).
$('hideUpBtn').addEventListener('click', () => {
  let n = 0;
  for (let i = 0; i < allFiles.length; i++) {
    const key = `${currentHost}:${allFiles[i]}`;
    if (voteOf(key) !== 'up' || hiddenUp.has(key)) continue;
    hiddenUp.add(key);
    if (cardEls[i]) removeCard(i);
    n++;
  }
  setStatus(statusSummary() + (n ? ` — hid ${n} thumbs-up` : ''));
});

$('unhideBtn').addEventListener('click', async () => {
  // unhide = clear all thumbs-down votes (thumbs-up stay marked)
  const downs = Object.keys(comments).filter(k => voteOf(k) === 'down');
  for (const k of downs) await setVerdict(k, null);
  renderList();
  setStatus(statusSummary() + (downs.length ? ` — unhid ${downs.length}` : ''));
});

init();
</script>
</body>
</html>
