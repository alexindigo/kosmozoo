<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/logo-64.png">
<title>Kosmozoo</title>
<style>
  :root {
    --bg: #14151a; --panel: #1d1f26; --card: #22242d; --border: #343745;
    --fg: #e6e6ea; --dim: #9a9dab; --accent: #7aa2f7; --ok: #9ece6a;
    --bad: #f7768e;
    --wipe-orange: #f76b0c;   /* split-wipe line color */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.45 system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  select, button, a.btn {
    background: var(--card); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer;
  }
  #filterInput {
    background: var(--card); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font: inherit; cursor: text;
    width: 170px;
  }
  #filterInput:focus { outline: none; border-color: var(--accent); }
  .fname .copyable { cursor: copy; }
  .fname .copyable:hover { color: var(--accent); }
  .fname .copied { color: var(--accent); }
  a.btn { text-decoration: none; display: inline-block; }
  button:hover { border-color: var(--accent); }
  button.on { border-color: var(--accent); color: var(--accent); }
  #status { color: var(--dim); font-size: 12px; }
  #unhideBtn { color: var(--dim); }   /* grey thumbs-down */
  #hideUpBtn { color: var(--dim); }   /* grey thumbs-up */
  #dlFeedback { margin-left: auto; }

  /* slide toggle switch */
  .switchwrap {
    display: inline-flex; align-items: center; gap: 7px;
    cursor: pointer; font-size: 12px; color: var(--dim); user-select: none;
  }
  .switchwrap input { display: none; }
  .switchwrap .track {
    width: 26px; height: 15px; border-radius: 8px; background: var(--border);
    position: relative; transition: background .15s; flex: 0 0 auto;
  }
  .switchwrap .track::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 11px; height: 11px; border-radius: 50%; background: var(--dim);
    transition: left .15s, background .15s;
  }
  .switchwrap input:checked + .track { background: var(--accent); }
  .switchwrap input:checked + .track::after { left: 13px; background: #fff; }
  .switchwrap.disabled { opacity: .45; pointer-events: none; }

  /* header menu */
  #menuWrap { position: relative; }
  #menu {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 50;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; min-width: 190px;
    display: flex; flex-direction: column; gap: 8px;
  }
  #menu[hidden] { display: none; }  /* author display:flex would otherwise
                                       override the hidden attribute */
  #menuStatus { font-size: 11px; color: var(--dim); }
  #scraperWrap {
    display: flex; align-items: center; gap: 8px; font-size: 12px;
  }
  #scraperWrap .switchwrap { flex: 0 0 auto; }
  #scraperPause { padding: 2px 8px; font-size: 12px; line-height: 1.4; }
  #scraperPause:disabled { opacity: .4; cursor: default; }
  #scraperPending { color: var(--dim); font-size: 11px; }
  #faceModelWrap {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--dim);
  }
  #faceModelWrap select { font-size: 12px; padding: 3px 6px; }
  #fbPathWrap {
    display: flex; flex-direction: column; gap: 5px;
    font-size: 11px; color: var(--dim);
  }
  #fbPathWrap .fbrow { display: flex; gap: 6px; }
  #fbPathWrap input {
    flex: 1; min-width: 0; background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 7px; font: 11px ui-monospace, monospace;
  }
  #fbPathWrap input:focus { outline: none; border-color: var(--accent); }
  #fbPathWrap button { font-size: 11px; padding: 4px 8px; }
  /* host picker (dropdown styled like the ☰ menu panel) */
  #hostPicker { position: relative; }
  #hostBtn { display: flex; align-items: center; gap: 7px; }
  #hostBtn .chev { font-size: 10px; color: var(--dim); }
  #hostBtn .hdot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); flex: 0 0 auto;
  }
  #hostBtn .hdot.off { background: var(--dim); }
  #hostDrop {
    position: absolute; top: calc(100% + 8px); left: 0; z-index: 50;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px; min-width: 280px;
    display: flex; flex-direction: column; gap: 2px;
  }
  #hostDrop[hidden] { display: none; }
  .hostpick {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px;
    border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .hostpick:hover { background: var(--card); }
  .hostpick.current { box-shadow: inset 0 0 0 1px var(--accent); }
  .hostpick.off > .hname, .hostpick.off > .haddr { opacity: .5; }
  .hostpick .hname { flex: 0 0 auto; font-weight: 600; }
  .hostpick .haddr {
    flex: 1; color: var(--dim); font-size: 11px;
    font-family: ui-monospace, monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hostpick .rm {
    padding: 0 6px; font-size: 11px; color: var(--bad); flex: 0 0 auto;
  }
  .haddrow {
    display: flex; gap: 6px; margin-top: 4px;
    border-top: 1px solid var(--border); padding-top: 8px;
  }
  .haddrow input {
    min-width: 0; flex: 1; background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 7px; font: 11px ui-monospace, monospace;
  }
  .haddrow input:focus { outline: none; border-color: var(--accent); }
  .haddrow button { font-size: 11px; padding: 4px 8px; }

  /* lightbox facebox-align toggle + guides toggle */
  #lbAlignWrap {
    position: absolute; top: 14px; left: 24px; z-index: 104;
    background: rgba(20,20,28,.65); border-radius: 8px; padding: 7px 10px;
  }
  #lbGuidesWrap {
    position: absolute; top: 48px; left: 24px; z-index: 104;
    background: rgba(20,20,28,.65); border-radius: 8px; padding: 7px 10px;
  }
  #lbFaceBoxWrap {
    position: absolute; top: 82px; left: 24px; z-index: 104;
    background: rgba(20,20,28,.65); border-radius: 8px; padding: 7px 10px;
  }
  #lbOverlayWrap {
    position: absolute; top: 116px; left: 24px; z-index: 104;
    background: rgba(20,20,28,.65); border-radius: 8px; padding: 7px 10px;
  }
  #lbSplitWrap {
    position: absolute; top: 150px; left: 24px; z-index: 104;
    background: rgba(20,20,28,.65); border-radius: 8px; padding: 7px 10px;
  }
  #lbLinkedWrap {
    position: absolute; top: 184px; left: 24px; z-index: 104;
    background: rgba(20,20,28,.65); border-radius: 8px; padding: 7px 10px;
  }
  #lbFlipWrap {
    position: absolute; bottom: 58px; left: 24px; z-index: 104;
    background: rgba(20,20,28,.65); border-radius: 8px; padding: 6px 8px;
    display: flex; gap: 6px;
  }
  #lbFlipWrap button { font-size: 11px; padding: 3px 9px; }
  #lbFlipWrap button.on { border-color: var(--accent); color: var(--accent); }
  /* guides hidden: lines and creation strips both off */
  #lightbox.guides-hidden #guideLayer,
  #lightbox.guides-hidden #guideStripTop,
  #lightbox.guides-hidden #guideStripLeft { display: none; }

  /* detected face box overlay (follows image zoom/pan) */
  #faceBox {
    position: absolute; z-index: 101; display: none;
    border: 2px solid var(--bad); border-radius: 4px;
    box-shadow: 0 0 4px rgba(0,0,0,.8), inset 0 0 4px rgba(0,0,0,.4);
    pointer-events: none;
  }
  #faceBox .eye {
    position: absolute; width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent); border: 1px solid #000;
    transform: translate(-50%, -50%);
  }

  main {
    display: flex; gap: 16px; padding: 16px; align-items: start;
  }
  #candidatesCol { flex: 1; min-width: 0; }

  /* candidates */
  #candidates { display: flex; flex-direction: column; gap: 16px; }

  /* hide scrollbars, scrolling itself stays enabled */
  body { scrollbar-width: none; }
  body::-webkit-scrollbar { display: none; }

  /* snap scrolling: candidates align to the top when scrolling settles */
  html { scroll-snap-type: y proximity; }
  .card { scroll-snap-align: start; scroll-margin-top: 66px; }

  #divider {
    flex: 0 0 7px; align-self: stretch; cursor: col-resize;
    background: var(--border); border-radius: 4px; margin: 0 -6px;
    position: relative; z-index: 5;
  }
  #divider:hover { background: var(--accent); }
  body.resizing { cursor: col-resize; user-select: none; }
  body.resizing iframe, body.resizing img { pointer-events: none; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px;
  }
  /* image box keeps its height via aspect-ratio even when the img is
     unloaded (windowed virtualization), so the list doesn't jump */
  .imgwrap {
    position: relative; width: 100%; aspect-ratio: var(--ar, 1);
    background: #0d0e12; border-radius: 4px; overflow: hidden;
  }
  .imgwrap img {
    display: block; width: 100%; height: 100%; object-fit: contain;
  }
  .imgwrap.empty img { visibility: hidden; }
  .imgwrap.loading::after {
    content: ''; position: absolute; inset: 0; margin: auto;
    width: 32px; height: 32px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }
  .imgwrap.error::after {
    content: '⚠ failed to load — click to retry'; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--bad); font-size: 13px; text-align: center; padding: 4px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sentinel {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; color: var(--dim); padding: 16px;
  }
  .sentinel::before {
    content: ''; width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }
  .endoflist { text-align: center; color: var(--dim); padding: 16px; }
  .fname {
    font-weight: 600; margin: 8px 0 2px; word-break: break-all;
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 8px;
  }
  .votebtn, .savebtn {
    flex: 0 0 auto; padding: 2px 8px; font-size: 11px; color: var(--dim);
  }
  .votebtn svg { vertical-align: -1px; }
  /* identity colors, muted until active/hover: down=red, up=green */
  .votebtn.down { color: rgba(247, 118, 142, .45); }
  .votebtn.up { color: rgba(158, 206, 106, .45); }
  .votebtn.down:hover, .votebtn.down.on { color: var(--bad); border-color: var(--bad); }
  .votebtn.up:hover, .votebtn.up.on { color: var(--ok); border-color: var(--ok); }
  .savebtn:hover { color: var(--ok); border-color: var(--ok); }
  .pair {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin-top: 6px;
  }
  .props { color: var(--dim); font-size: 12px; }
  .props .nometa { color: var(--bad); }
  .props .plabel { color: var(--fg); opacity: .55; }
  .desc {
    color: var(--dim); font-size: 12px; font-style: italic;
    word-break: break-word;
  }
  .card textarea.neg { border-color: var(--bad); }
  .card textarea.pos { border-color: var(--ok); }
  .card textarea.neg:focus { border-color: var(--bad); outline: none; }
  .card textarea.pos:focus { border-color: var(--ok); outline: none; }
  .boxcol { display: flex; flex-direction: column; gap: 4px; }
  .btnrow { display: flex; gap: 6px; }
  .btnrow button {
    flex: 1; padding: 2px 4px; font-size: 11px; color: var(--dim);
  }

  /* anchor embedded metadata */
  .ameta { margin-top: 4px; display: none; }
  .ameta .pair { grid-template-columns: 1fr; gap: 4px; margin-top: 4px; }
  .anchor .props, .anchor .desc { font-size: 11px; }

  /* lightbox (pinch/ctrl-wheel zoom) */
  #lightbox {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.88); overflow: hidden;
  }
  #lightbox.open { display: block; }
  #lightbox img.layer {
    position: absolute; left: 50%; top: 50%;
    /* transform is fully JS-computed (zoom/pan/flip/rotate); this is the
       pre-JS fallback only */
    transform: translate(-50%,-50%);
    max-width: 95vw; max-height: 95vh; cursor: grab;
    user-select: none; -webkit-user-drag: none;
  }
  #lightbox img#lbBase { pointer-events: none; cursor: default; }
  #lightbox img#lbPrev { pointer-events: none; display: none; }
  #lightbox img.dragging { cursor: grabbing; }
  /* untransformed screen-space clip wrapper for the candidate layer:
     the split line and the clip then share the same viewport coordinates */
  #lbClipWrap {
    position: absolute; inset: 0; pointer-events: none;
  }
  #lbClipWrap img { pointer-events: auto; }
  /* split-wipe handle (overlay mode) */
  #lbSplit {
    position: absolute; top: 0; bottom: 0; width: 17px; margin-left: -8px;
    cursor: col-resize; z-index: 105; display: none;
  }
  #lbSplit .line {
    width: 2px; height: 100%; margin: 0 auto;
    background: var(--wipe-orange); box-shadow: 0 0 4px rgba(0,0,0,.9);
  }
  /* bottom-left: candidate-over-anchor transparency slider */
  #lbMixWrap {
    position: absolute; bottom: 14px; left: 24px; z-index: 104;
    display: flex; gap: 8px; align-items: center;
    background: rgba(20,20,28,.65); border-radius: 8px; padding: 7px 10px;
    color: var(--dim); font-size: 12px;
  }
  #lbMix { width: 150px; accent-color: var(--accent); }
  /* "ANCHOR" tag sits where the slider sits, when viewing an anchor */
  #lbAnchorTag {
    position: absolute; bottom: 14px; left: 24px; z-index: 104;
    display: none; padding: 7px 12px; border-radius: 8px;
    background: rgba(20,20,28,.65);
    color: var(--wipe-orange); font-weight: 700; letter-spacing: 2px;
    font-size: 12px; user-select: none;
  }
  #lbClose {
    position: absolute; top: 14px; right: 16px; z-index: 101;
    width: 34px; height: 34px; border-radius: 50%; font-size: 18px;
    background: rgba(30,30,40,.8);
    display: flex; align-items: center; justify-content: center;
    padding: 0; line-height: 1;
  }
  #lbHint {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: var(--dim); font-size: 12px; pointer-events: none;
  }
  /* guide creation strips (lightbox top/left edges) + guide lines */
  #guideStripTop, #guideStripLeft { position: absolute; z-index: 103; }
  #guideStripTop { top: 0; left: 0; right: 0; height: 18px; cursor: row-resize; }
  #guideStripLeft { top: 0; left: 0; bottom: 0; width: 18px; cursor: col-resize; }
  #guideLayer {
    position: absolute; inset: 0; z-index: 102; pointer-events: none;
  }
  .guide {
    position: absolute; pointer-events: auto;
    background: rgba(34, 211, 238, .9);
    background-clip: content-box;   /* visual line stays 2px; padding = grab area */
  }
  .guide.h { left: 0; right: 0; height: 2px; padding: 5px 0;
             cursor: row-resize; }
  .guide.v { top: 0; bottom: 0; width: 2px; padding: 0 5px;
             cursor: col-resize; }
  .card textarea {
    width: 100%; min-height: 44px; resize: vertical;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; font: inherit;
  }
  .card textarea:focus { outline: none; border-color: var(--accent); }
  .saved { font-size: 11px; color: var(--ok); margin-right: 8px;
           align-self: center; white-space: nowrap; opacity: 0;
           transition: opacity .3s; }
  .saved.show { opacity: 1; }

  /* Advanced-mode gating: hidden unless body.advanced */
  .adv, .adv-flex, .adv-ib { display: none !important; }
  body.advanced .adv { display: block !important; }
  body.advanced .adv-flex { display: flex !important; }
  body.advanced .adv-ib { display: inline-block !important; }
  .advrow {
    gap: 10px; margin: 6px 0 2px; font-size: 11px; align-items: center;
  }
  .advsel { display: flex; gap: 5px; align-items: center; }
  .advsel span { color: var(--dim); }
  .advsel select { font-size: 11px; padding: 3px 6px; }
  .menusep { border: 0; border-top: 1px solid var(--border); margin: 2px 0; }
  /* prompt expand (Advanced) */
  .desc.expanded {
    font-style: normal; color: var(--fg); background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px;
    max-height: 300px; overflow-y: auto; white-space: pre-wrap;
    cursor: zoom-out;
  }
  body.advanced .desc { cursor: zoom-in; }
  /* group-by-prompt (Advanced) */
  details.group {
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
  }
  details.group > summary {
    cursor: pointer; color: var(--accent); font-size: 13px;
    margin-bottom: 4px; user-select: none;
  }
  details.group .card { margin-bottom: 12px; }

  /* anchors */
  #anchors {
    position: sticky; top: 66px; max-height: calc(100vh - 82px);
    overflow-y: auto; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    /* width is dragged via #divider */
    width: 360px; min-width: 220px; max-width: 70vw;
    flex: 0 0 auto;
    scrollbar-width: none;
  }
  #anchors::-webkit-scrollbar { display: none; }
  #dropzone {
    border: 2px dashed var(--border); border-radius: 8px;
    padding: 18px; text-align: center; color: var(--dim);
    cursor: pointer; margin-top: 4px;
  }
  #dropzone.over { border-color: var(--accent); color: var(--accent); }
  .anchor { position: relative; margin-bottom: 12px; cursor: grab; }
  .anchor.dragging { opacity: .4; }
  .imgwrap img.zoomed, .aimgwrap img.zoomed { cursor: grab; }
  .imgwrap img, .aimgwrap img { will-change: transform; }
  .anchor img { display: block; width: 100%; border-radius: 6px; }
  .anchor .aname { font-size: 11px; color: var(--dim); margin-top: 3px;
                   word-break: break-all; }
  .aimgwrap { position: relative; overflow: hidden; border-radius: 6px; }
  .aimgwrap img { display: block; }
  .anchor .rm {
    position: absolute; top: 4px; right: 4px; width: 24px; height: 24px;
    padding: 0; border-radius: 50%; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    background: rgba(20, 20, 28, .35); border: 1px solid rgba(255,255,255,.15);
    color: rgba(255, 255, 255, .7);
  }
  .anchor .rm:hover { background: rgba(20,20,28,.8); color: #fff; }
  .empty { color: var(--dim); text-align: center; padding: 30px 0; }
</style>
</head>
<body>
<header>
  <img src="/logo-64.png" alt="kosmozoo" width="24" height="24"
       style="border-radius:6px">
  <h1>Kosmozoo</h1>
  <div id="hostPicker">
    <button id="hostBtn" title="choose host">
      <span class="hdot off" id="hostDot"></span><span id="hostBtnLabel">host…</span><span class="chev">▾</span>
    </button>
    <div id="hostDrop" hidden>
      <div id="hostList"></div>
      <div class="haddrow">
        <input type="text" id="hostName" placeholder="name" spellcheck="false">
        <input type="text" id="hostAddr" placeholder="host:port" spellcheck="false">
        <button id="hostAdd">add</button>
      </div>
    </div>
  </div>
  <input type="text" id="filterInput" placeholder="filter filenames…"
         spellcheck="false" title="filter by filename substring">
  <button id="refreshBtn">Refresh</button>
  <button id="groupBtn" class="adv-ib" title="group candidates by identical prompt (Advanced)">Group by prompt</button>
  <span id="status"></span>
  <button id="unhideBtn" title="unhide all thumbs-down images">Unhide <svg viewBox="0 0 24 24" width="12" height="12" style="vertical-align:-1px"><path fill="currentColor" d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg></button>
  <button id="hideUpBtn" title="hide all thumbs-up images for this session (they stay marked; reload restores)">Hide <svg viewBox="0 0 24 24" width="12" height="12" style="vertical-align:-1px"><path fill="currentColor" d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg></button>
  <a id="dlFeedback" class="btn" href="/api/feedback" download="feedback.json"
     title="download the exact feedback.json as stored on the server">Download feedback</a>
  <div id="menuWrap">
    <button id="menuBtn" title="options">☰</button>
    <div id="menu" hidden>
      <label class="switchwrap"><input type="checkbox" id="advToggle"><span class="track"></span><b>Advanced mode</b></label>
      <hr class="menusep">
      <label class="switchwrap"><input type="checkbox" id="faceDetectToggle"><span class="track"></span>face detection</label>
      <label id="faceModelWrap">model
        <select id="faceModel">
          <option value="anime">anime (local)</option>
          <option value="mp">mediapipe</option>
        </select>
      </label>
      <hr class="menusep">
      <div id="scraperWrap">
        <label class="switchwrap" title="walk the host's image list and extract PNG-embedded metadata in the background">
          <input type="checkbox" id="scraperToggle"><span class="track"></span>metadata scan
        </label>

</header>
<main>

</main>
<div id="lightbox">

  <div id="guideStripLeft" title="drag right to place a vertical guide"></div>

    <input type="checkbox" id="lbAlign"><span class="track"></span>match facebox
  </label>

    <input type="checkbox" id="lbGuides"><span class="track"></span>guides
  </label>
  <label id="lbFaceBoxWrap" class="switchwrap" title="show/hide detected face box + eye markers">
    <input type="checkbox" id="lbFaceBoxT"><span class="track"></span>facebox
  </label>

    <input type="checkbox" id="lbOverlay"><span class="track"></span>overlay
  </label>

    <input type="checkbox" id="lbSplitT"><span class="track"></span>split
  </label>

  </label>

    <button id="lbFlipV" title="flip vertical (V)">⇅ V</button>
