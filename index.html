    <input type="range" id="lbMix" min="0" max="100" value="100">
    <span id="lbMixVal">100%</span>
  </div>
  <div id="lbAnchorTag">ANCHOR</div>
  <div id="lbSplit" title="drag to wipe-compare (left: anchor · right: candidate)"><div class="line"></div></div>
  <div id="lbHint">pinch / -+ zoom · drag / shift+arrows pan · Alt+drag rotate · H/V flip · matched or Shift-drag pans both · arrows switch · split line wipes · guides from edges · Esc closes</div>
</div>

<script>
'use strict';

const $ = (id) => document.getElementById(id);
const candidatesEl = $('candidates'),
      statusEl = $('status'), anchorList = $('anchorList'),
      dropzone = $('dropzone'), fileInput = $('fileInput'),
      divider = $('divider'), anchorsEl = $('anchors');

let currentHost = null;
let comments = {};            // "host:file" -> {neg, pos} (legacy strings normalized)
const saveTimers = {};        // key -> timeout id

// localStorage keys
const LS_WIDTH = 'kosmozoo.anchorWidth';   // e.g. "420px"

// Votes live in feedback.json on the server (canonical). comments[key]
// may be {neg, pos, vote} or a legacy plain string.
function voteOf(key) {
  const v = comments[key];
  return (v && typeof v === 'object' && v.vote) || null;
}

// Session-only view filter: thumbs-up images hidden via the header button.
// Not persisted — a full page reload restores them (votes stay marked).
const hiddenUp = new Set();

function isHidden(key) {
  return voteOf(key) === 'down' || hiddenUp.has(key);
}

// Generic feedback field write: optimistic local merge (mirrors the
// server's prune rules) + POST. Clear semantics: null/'' remove a field;
// tag 'character' is the default and is stored as absent.
async function postField(key, field, value) {
  const e = (comments[key] && typeof comments[key] === 'object')
    ? { ...comments[key] } : {};
  if (value === null || value === '' ||
      (field === 'tag' && value === 'character'))
    delete e[field];
  else
    e[field] = value;
  const hasContent = (e.neg || '').trim() || (e.pos || '').trim() ||
                     e.vote || e.bucket || e.tag;
  if (hasContent) comments[key] = e;
  else delete comments[key];
  const [host, ...rest] = key.split(':');
  try {
    await fetch('/api/comments', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ host, file: rest.join(':'), [field]: value }),
    });
  } catch (err) {
    setStatus(`${field} save failed: ${err.message}`, true);
  }
}

function setVerdict(key, vote) {   // vote: 'up' | 'down' | null
  return postField(key, 'vote', vote);
}

// Filenames present in ~/Downloads (source of truth for the save button).
let downloadsSet = new Set();

// Curation buckets come from the server config (config.json / env), so the
// code carries no project-specific taxonomy.
let bucketList = [];

// Stored comment value -> {neg, pos} (tolerates legacy plain-string values)
function commentParts(v) {
  if (!v) return { neg: '', pos: '' };
  if (typeof v === 'string') return { neg: v, pos: '' };
  return { neg: v.neg || '', pos: v.pos || '' };
}

// ---------- helpers ----------

function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.style.color = isError ? 'var(--bad)' : 'var(--dim)';
}

async function api(path) {
  const resp = await fetch(path);
  if (!resp.ok) {
    let msg = resp.status;
    try { msg = (await resp.json()).error || msg; } catch (e) { /* keep */ }
    throw new Error(msg);
  }
  return resp.json();
}

// Strip the " [output]" style suffix /internal/files/output appends.
function cleanFileName(entry) {
  return String(entry).replace(/\s+\[[^\]]+\]$/, '');
}

// ---------- metadata extraction from /api/history ----------

// history entry -> {seed, steps, cfg, sampler, scheduler, denoise,
//                   loras: [{name, strength}], prompt}
function extractMeta(entry) {
  const graph = entry.prompt && entry.prompt[2];
  if (!graph) return null;
  const nodes = Object.entries(graph).map(([id, n]) => ({ id, ...n }));

  const ks = nodes.find(n => n.class_type === 'KSampler') ||
             nodes.find(n => /sampler/i.test(n.class_type || ''));
  const meta = { loras: [] };
  if (ks && ks.inputs) {
    for (const k of ['seed', 'steps', 'cfg', 'sampler_name', 'scheduler',
                     'denoise']) {
      if (typeof ks.inputs[k] !== 'undefined') meta[k] = ks.inputs[k];
    }
  }

  // Positive prompt: follow links from KSampler.positive until a node
  // with a string `text` input (CLIPTextEncode), e.g. through FluxGuidance.
  let promptText = '';
  let node = ks && ks.inputs && Array.isArray(ks.inputs.positive)
    ? graph[ks.inputs.positive[0]] : null;
  for (let i = 0; i < 8 && node; i++) {
    if (node.inputs && typeof node.inputs.text === 'string') {
      promptText = node.inputs.text;
      break;
    }
    const next = Object.values(node.inputs || {}).find(Array.isArray);
    node = next ? graph[next[0]] : null;
  }
  meta.prompt = promptText.replace(/\s+/g, ' ').trim();

  // Image dimensions (for exact aspect-ratio placeholders before first load)
  const latent = nodes.find(n => /Empty.*Latent/i.test(n.class_type || ''));
  if (latent && latent.inputs) {
    if (typeof latent.inputs.width === 'number')
      meta.width = latent.inputs.width;
    if (typeof latent.inputs.height === 'number')
      meta.height = latent.inputs.height;
  }

  // LoRA loaders (LoraLoader, NunchakuFluxLoraLoader, ...)
  for (const n of nodes) {
    if (/lora/i.test(n.class_type || '') && /load/i.test(n.class_type || '')) {
      const inp = n.inputs || {};
      meta.loras.push({
        name: inp.lora_name || inp.lora || '?',
        strength: inp.lora_strength ?? inp.strength_model ?? inp.strength,
      });
    }
  }
  return meta;
}

// ---------- candidates: chunked render + windowed image loading ----------
// Cards render CHUNK at a time; a sentinel WINDOW_PAD cards before the end
// of the rendered list triggers the next chunk. Image bytes load only for
// cards within the viewport ± WINDOW_PAD; images outside get their src
// removed (height is preserved via aspect-ratio, so the list doesn't jump).

const CHUNK = 20;
const WINDOW_PAD = 10;

let allFiles = [];            // filenames for current host, newest-first
let fileIndex = new Map();    // filename -> allFiles position
let metaMapGlobal = {};       // filename -> meta
let metaVersion = 0;          // server-side metadata store version
let metaPending = 0;          // files queued for PNG metadata extraction
let metaPollTimer = null;
const wantSet = new Set();    // rendered-but-meta-less filenames to report
let wantTimer = null;
let filterText = '';          // filename substring filter (header input)
let viewFiles = [];           // allFiles indices matching the filter
let viewPos = 0;              // render progress within viewFiles
let cardEls = [];             // allFiles idx -> card element
let visibleSet = new Set();   // card indices intersecting the viewport
let loadedSet = new Set();    // card indices whose img currently has src
let listObserver = null;
let sentinelObserver = null;
let sentinelEl = null;

function recomputeView() {
  if (!filterText) {
    viewFiles = allFiles.map((_, i) => i);
    return;
  }
  const q = filterText.toLowerCase();
  viewFiles = [];
  for (let i = 0; i < allFiles.length; i++)
    if (allFiles[i].toLowerCase().includes(q)) viewFiles.push(i);
}

function resetList() {
  if (listObserver) listObserver.disconnect();
  if (sentinelObserver) sentinelObserver.disconnect();
  candidatesEl.innerHTML = '';
  viewPos = 0;
  cardEls = [];
  visibleSet = new Set();
  loadedSet = new Set();
  sentinelEl = null;
}

function statusSummary() {
  const hidden = allFiles.filter(
    f => isHidden(`${currentHost}:${f}`)).length;
  let s;
  if (filterText) {
    const shown = viewFiles.filter(
      i => !isHidden(`${currentHost}:${allFiles[i]}`)).length;
    s = `${shown} of ${allFiles.length} matching “${filterText}” from ` +
        `${currentHost}` + (hidden ? ` (${hidden} hidden)` : '');
  } else {
    s = `${allFiles.length} images from ${currentHost}` +
        (hidden ? ` (${hidden} hidden)` : '');
  }
  if (metaPending > 0) s += ` · metadata ${metaPending} left`;
  return s;
}

async function loadCandidates() {
  if (!currentHost) return;
  resetList();
  allFiles = [];
  metaMapGlobal = {};
  setStatus(`loading image list from ${currentHost}…`);
  try {
    // /api/metadata = persistent cache merged with live history (server-side)
    const [files, metadata] = await Promise.all([
      api(`/api/files?host=${encodeURIComponent(currentHost)}`),
      api(`/api/metadata?host=${encodeURIComponent(currentHost)}`),
    ]);
    metaMapGlobal = metadata.items || {};
    metaVersion = metadata.v || 0;
    metaPending = metadata.pending || 0;
    allFiles = files.map(cleanFileName);   // endpoint is newest-first
    fileIndex = new Map(allFiles.map((n, i) => [n, i]));
    recomputeView();
    // downloads check is batched, names-only -> {name: bool} (no listing)
    downloadsSet = new Set();
    try {
      const r = await fetch('/api/downloads-check', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ files: allFiles }),
      });
      const d = await r.json();
      downloadsSet = new Set(Object.keys(d.exists || {})
        .filter(k => d.exists[k]));
    } catch (e) { /* save buttons just won't pre-grey */ }
    if (!allFiles.length) {
      candidatesEl.innerHTML = '<div class="empty">no output images</div>';
      setStatus(`no output images on ${currentHost}`);
      return;
    }
    renderList();
    setStatus(statusSummary());
    updateScraperUi();
    if (metaPending > 0) scheduleMetaPoll();
  } catch (err) {
    setStatus(`load failed: ${err.message}`, true);
  }
}

// --- metadata backfill: poll + in-place patch + scroll-driven wants -------

function scheduleMetaPoll(delay = 5000) {
  clearTimeout(metaPollTimer);
  metaPollTimer = setTimeout(pollMetadata, delay);
}

async function pollMetadata() {
  if (!currentHost) return;
  try {
    const r = await api(`/api/metadata?host=${encodeURIComponent(currentHost)}`);
    metaPending = r.pending || 0;
    if (r.v !== metaVersion) {
      metaVersion = r.v;
      mergeMetadata(r.items || {});
    }
    updateScraperUi();
    setStatus(statusSummary());
  } catch (e) { /* transient; next poll retries */ }
  if (metaPending > 0) scheduleMetaPoll();
}

function mergeMetadata(items) {
  const newly = [];
  for (const [k, v] of Object.entries(items)) {
    if (!metaMapGlobal[k]) newly.push(k);
    metaMapGlobal[k] = v;
  }
  for (const name of newly) patchCardMeta(name);
}

// A card rendered before its metadata arrived gets patched in place.
function patchCardMeta(name) {
  const idx = fileIndex.get(name);
  if (idx === undefined) return;
  const card = cardEls[idx];
  if (!card) return;
  const meta = metaMapGlobal[name];
  if (!meta) return;
  const props = card.querySelector('.props');
  const desc = card.querySelector('.desc');
  if (props && desc) fillCardMeta(props, desc, meta);
  if (meta.width && meta.height) {
    card.dataset.nw = meta.width;
    card.dataset.nh = meta.height;
    const wrap = card.querySelector('.imgwrap');
    if (wrap)
      wrap.style.setProperty('--ar', `${meta.width} / ${meta.height}`);
  }
}

// Scroll-driven extraction: rendered-but-meta-less filenames are reported
// to the server (debounced), which moves them to the front of the queue.
function wantMeta(name) {
  if (metaMapGlobal[name] || wantSet.has(name)) return;
  wantSet.add(name);
  clearTimeout(wantTimer);
  wantTimer = setTimeout(flushWant, 1500);
}

async function flushWant() {
  if (!currentHost) return;
  const files = [...wantSet].filter(n => !metaMapGlobal[n]);
  wantSet.clear();
  if (!files.length) return;
  try {
    const r = await fetch('/api/meta-want', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ host: currentHost, files }),
    });
    const d = await r.json();
    if (typeof d.pending === 'number') {
      metaPending = d.pending;
      updateScraperUi();
      if (metaPending > 0) scheduleMetaPoll();
      setStatus(statusSummary());
    }
  } catch (e) { /* next render re-wants */ }
}

// Chunked flat list (default) or grouped-by-prompt (Advanced toggle).
let groupMode = localStorage.getItem('kosmozoo.groupByPrompt') === '1';

function renderList() {
  resetList();
  setupObservers();
  if (groupMode) renderGrouped();
  else renderChunk();
}

function setupObservers() {
  listObserver = new IntersectionObserver((entries) => {
    let changed = false;
    for (const en of entries) {
      const idx = Number(en.target.dataset.idx);
      if (en.isIntersecting) {
        if (!visibleSet.has(idx)) { visibleSet.add(idx); changed = true; }
      } else if (visibleSet.delete(idx)) changed = true;
    }
    if (changed) applyWindow();
  });
  sentinelObserver = new IntersectionObserver((entries) => {
    if (entries.some(en => en.isIntersecting)) renderChunk();
  });
}

// Load images inside viewport ± WINDOW_PAD, unload everything outside.
// Errored cards (host was busy) auto-retry every ERROR_RETRY_MS while
// they stay in the window.
const ERROR_RETRY_MS = 8000;
let errorRetryTimer = null;

function scheduleErrorRetry() {
  if (errorRetryTimer) return;
  errorRetryTimer = setTimeout(() => {
    errorRetryTimer = null;
    const min = Math.min(...visibleSet) - WINDOW_PAD;
    const max = Math.max(...visibleSet) + WINDOW_PAD;
    let any = false;
    for (const idx of [...loadedSet]) {
      if (idx < min || idx > max) continue;
      const card = cardEls[idx];
      const wrap = card && card.querySelector('.imgwrap');
      if (wrap && wrap.classList.contains('error')) {
        retryLoadImage(idx);
        any = true;
      }
    }
    if (any) scheduleErrorRetry();   // still errored → keep retrying
  }, ERROR_RETRY_MS);
}

function applyWindow() {
  if (!visibleSet.size) return;
  const min = Math.min(...visibleSet) - WINDOW_PAD;
  const max = Math.max(...visibleSet) + WINDOW_PAD;
  for (const idx of [...loadedSet]) {
    if (idx < min || idx > max) unloadImage(idx);
  }
  // cardEls is indexed by allFiles position (sparse) — valid in chunked,
  // grouped and filtered modes; viewPos tracks chunked render progress
  const lo = Math.max(0, min), hi = Math.min(cardEls.length - 1, max);
  for (let i = lo; i <= hi; i++) {
    if (!loadedSet.has(i)) loadImage(i);
  }
  scheduleErrorRetry();
}

function loadImage(idx) {
  const card = cardEls[idx];
  if (!card) return;
  const wrap = card.querySelector('.imgwrap');
  const img = wrap.querySelector('img');
  wrap.classList.remove('empty');
  wrap.classList.remove('error');
  wrap.classList.add('loading');
  img.src = card.dataset.imgUrl;
  loadedSet.add(idx);
}

// Manual retry for failed images (click on the error placeholder).
// Cache-busts so a partial/aborted cached response can't be reused.
function retryLoadImage(idx) {
  const card = cardEls[idx];
  if (!card) return;
  const wrap = card.querySelector('.imgwrap');
  const img = wrap.querySelector('img');
  img.removeAttribute('src');
  wrap.classList.remove('error');
  wrap.classList.add('loading');
  img.src = card.dataset.imgUrl +
    (card.dataset.imgUrl.includes('?') ? '&' : '?') + '_r=' + Date.now();
  loadedSet.add(idx);
}

function unloadImage(idx) {
  const card = cardEls[idx];
  if (!card) return;
  const wrap = card.querySelector('.imgwrap');
  const img = wrap.querySelector('img');
  img.removeAttribute('src');   // aborts fetch / releases decoded bytes
  wrap.classList.remove('loading');
  wrap.classList.add('empty');
  loadedSet.delete(idx);
}

function renderChunk() {
  let added = 0;
  const frag = document.createDocumentFragment();
  while (viewPos < viewFiles.length && added < CHUNK) {
    const i = viewFiles[viewPos++];
    const name = allFiles[i];
    if (isHidden(`${currentHost}:${name}`)) continue;  // hidden
    wantMeta(name);   // on-screen metadata jumps the extraction queue
    const card = renderCard(name, metaMapGlobal[name], i);
    cardEls[i] = card;
    frag.appendChild(card);
    listObserver.observe(card);
    added++;
  }
  candidatesEl.appendChild(frag);

  if (sentinelEl) sentinelEl.remove();
  if (viewPos < viewFiles.length) {
    if (!sentinelEl) {
      sentinelEl = document.createElement('div');
      sentinelEl.className = 'sentinel';
      sentinelEl.textContent = 'loading more…';
      sentinelObserver.observe(sentinelEl);
    }
    // Place sentinel WINDOW_PAD rendered cards before the end of the list:
    // reaching it means the user scrolled into the last WINDOW_PAD cards.
    const rendered = cardEls.filter(Boolean);
    const trigger = rendered[Math.max(0, rendered.length - WINDOW_PAD)];
    if (trigger) candidatesEl.insertBefore(sentinelEl, trigger);
    else candidatesEl.appendChild(sentinelEl);
  } else {
    const done = document.createElement('div');
    done.className = 'endoflist';
    done.textContent = filterText
      ? `— all ${viewFiles.length} matching “${filterText}” —`
      : `— all ${allFiles.length} images —`;
    candidatesEl.appendChild(done);
  }
  // Newly rendered cards inside the current window may not get an
  // IntersectionObserver change event (nothing intersecting changed),
  // so apply the window explicitly after each chunk.
  applyWindow();
}

// Advanced: group-by-prompt view. Collapsible <details> per identical
// prompt, groups ordered by their newest image, cards newest-first inside.
// Image windowing (IntersectionObserver) works unchanged — cards keep
// their allFiles index. Hidden filtering applies as in flat mode.
function renderGrouped() {
  const groups = new Map();   // prompt -> [{name, meta, idx}]
  for (const i of viewFiles) {
    const name = allFiles[i];
    if (isHidden(`${currentHost}:${name}`)) continue;
    wantMeta(name);   // on-screen metadata jumps the extraction queue
    const meta = metaMapGlobal[name];
    const p = (meta && meta.prompt) || '(no prompt in history)';
    if (!groups.has(p)) groups.set(p, []);
    groups.get(p).push({ name, meta, idx: i });
  }
  for (const [prompt, items] of groups) {
    const det = document.createElement('details');
    det.open = true;
    det.className = 'group';
    const sum = document.createElement('summary');
    const excerpt = prompt.length > 90 ? prompt.slice(0, 90) + '…' : prompt;
    sum.textContent = `${excerpt} · ${items.length}`;
    sum.title = prompt;
    det.appendChild(sum);
    for (const it of items) {
      const card = renderCard(it.name, it.meta, it.idx);
      cardEls[it.idx] = card;
      det.appendChild(card);
      listObserver.observe(card);
    }
    candidatesEl.appendChild(det);
  }
  applyWindow();
}

// Advanced metadata panel content; also used to patch rendered cards in
// place when backfilled metadata arrives after the card was rendered.
// Idempotent: uses .onclick assignment (never stacks listeners).
function fillCardMeta(props, desc, meta) {
  props.textContent = '';
  desc.textContent = '';
  desc.title = '';
  desc.onclick = null;
  if (meta) {
    const rows = [];
    if (meta.seed !== undefined) rows.push(['seed', meta.seed]);
    if (meta.steps !== undefined) rows.push(['steps', meta.steps]);
    if (meta.cfg !== undefined) rows.push(['cfg', meta.cfg]);
    if (meta.denoise !== undefined)
      rows.push(['denoise', Number(meta.denoise).toFixed(2)]);
    if (meta.sampler_name)
      rows.push(['sampler', meta.scheduler
        ? `${meta.sampler_name}/${meta.scheduler}` : meta.sampler_name]);
    for (const l of meta.loras || [])
      rows.push(['lora', `${l.name}${l.strength != null ? '@' + l.strength : ''}`]);
    if (meta.width && meta.height)
      rows.push(['size', `${meta.width}×${meta.height}`]);
    if (rows.length) {
      for (const [k, v] of rows) {
        const line = document.createElement('div');
        const label = document.createElement('span');
        label.className = 'plabel';
        label.textContent = `${k}: `;
        line.appendChild(label);
        line.appendChild(document.createTextNode(v));
        props.appendChild(line);
      }
    } else {
      props.textContent = '(no sampler metadata)';
    }
  } else {
    const span = document.createElement('span');
    span.className = 'nometa';
    span.textContent = 'no metadata yet';
    props.appendChild(span);
  }
  if (meta && meta.prompt) {
    const excerpt = meta.prompt.length > 300
      ? meta.prompt.slice(0, 300) + '…' : meta.prompt;
    desc.textContent = excerpt;
    desc.title = meta.prompt;
    // Advanced: click expands to the full prompt (+ negative when present)
    desc.onclick = () => {
      if (!document.body.classList.contains('advanced')) return;
      const on = desc.classList.toggle('expanded');
      desc.textContent = on
        ? meta.prompt +
          (meta.negPrompt ? `\n\n— negative —\n${meta.negPrompt}` : '')
        : excerpt;
    };
  }
}

function renderCard(filename, meta, idx) {
  const key = `${currentHost}:${filename}`;
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.idx = idx;
  card.dataset.name = filename;
  if (meta && meta.width && meta.height) {
    card.dataset.nw = meta.width;
    card.dataset.nh = meta.height;
  }
  card.dataset.imgUrl =
    `/api/image?host=${encodeURIComponent(currentHost)}` +
    `&file=${encodeURIComponent(filename)}`;

  const wrap = document.createElement('div');
  wrap.className = 'imgwrap empty';
  if (meta && meta.width && meta.height)
    wrap.style.setProperty('--ar', `${meta.width} / ${meta.height}`);
  const img = document.createElement('img');
  img.alt = filename;
  img.addEventListener('load', () => {
    if (img.naturalWidth && img.naturalHeight)
      wrap.style.setProperty(
        '--ar', `${img.naturalWidth} / ${img.naturalHeight}`);
    wrap.classList.remove('loading');
  });
  img.addEventListener('error', () => {
    if (img.getAttribute('src')) {   // ignore unload-triggered error events
      wrap.classList.remove('loading');
      wrap.classList.add('error');
    }
  });
  wrap.appendChild(img);
  wrap.style.cursor = 'zoom-in';
  wrap.addEventListener('click', () => {
    // failed loads (host was busy, transient network) retry instead of
    // opening the lightbox on a broken image
    if (wrap.classList.contains('error')) {
      retryLoadImage(idx);
      return;
    }
    openLightbox(card.dataset.imgUrl, img);
  });
  makeZoomable(img, { zoomKey: key });
  if (zoomStore[key]) img._setZoom(zoomStore[key]);
  card.appendChild(wrap);

  const fname = document.createElement('div');
  fname.className = 'fname';
  const savedEl = document.createElement('span');
  savedEl.className = 'saved';
  savedEl.textContent = 'Feedback saved';
  const fnameText = document.createElement('span');
  fnameText.textContent = filename;
  fnameText.className = 'copyable';
  fnameText.title = 'click to copy the filename';
  fnameText.addEventListener('click', async (e) => {
    e.stopPropagation();
    try {
      await navigator.clipboard.writeText(filename);
      fnameText.classList.add('copied');
      setTimeout(() => fnameText.classList.remove('copied'), 800);
    } catch (err) { /* clipboard unavailable (permissions/shim) */ }
  });
  const btnWrap = document.createElement('span');
  btnWrap.style.whiteSpace = 'nowrap';
  const verdict = voteOf(key);
  const THUMB_UP = '<svg viewBox="0 0 24 24" width="12" height="12"><path fill="currentColor" d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>';
  const THUMB_DOWN = '<svg viewBox="0 0 24 24" width="12" height="12"><path fill="currentColor" d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg>';
  const downBtn = document.createElement('button');
  downBtn.className = 'votebtn down' + (verdict === 'down' ? ' on' : '');
  downBtn.innerHTML = THUMB_DOWN;
  downBtn.title = 'thumbs down — hides (Unhide up top restores)';
  downBtn.addEventListener('click', () => {
    setVerdict(key, 'down');
    removeCard(idx);
    setStatus(statusSummary());
  });
  const upBtn = document.createElement('button');
  upBtn.className = 'votebtn up' + (verdict === 'up' ? ' on' : '');
  upBtn.innerHTML = THUMB_UP;
  upBtn.title = 'thumbs up';
  upBtn.addEventListener('click', () => {
    setVerdict(key, voteOf(key) === 'up' ? null : 'up');
    upBtn.classList.toggle('on', voteOf(key) === 'up');
  });
  const saveBtn = document.createElement('button');
  const isSaved = () => downloadsSet.has(filename);
  saveBtn.className = 'savebtn';
  saveBtn.textContent = isSaved() ? 'saved' : 'save';
  saveBtn.title = isSaved()
    ? 'already in ~/Downloads (click to download again)'
    : 'download this image';
  saveBtn.addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = card.dataset.imgUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    downloadsSet.add(filename);   // optimistic; refreshed from disk on reload
    saveBtn.textContent = 'saved';
    saveBtn.title = 'already in ~/Downloads (click to download again)';
  });
  btnWrap.append(savedEl, downBtn, upBtn, saveBtn);  // "Feedback saved" left of thumbs
  fname.append(fnameText, btnWrap);
  card.appendChild(fname);

  // Advanced row: curation bucket + note-type tag (stored in feedback.json)
  const extras = (() => {
    const v = comments[key];
    return (v && typeof v === 'object')
      ? { bucket: v.bucket || '', tag: v.tag || 'character' }
      : { bucket: '', tag: 'character' };
  })();
  const mkSel = (labelText, options, current, field) => {
    const lab = document.createElement('label');
    lab.className = 'advsel';
    const span = document.createElement('span');
    span.textContent = labelText;
    const sel = document.createElement('select');
    for (const val of options) {
      const o = document.createElement('option');
      o.value = val;
      o.textContent = val || '(unset)';
      sel.appendChild(o);
    }
    sel.value = current;
    sel.addEventListener('change', async () => {
      await postField(key, field, sel.value);
      savedEl.classList.add('show');
      setTimeout(() => savedEl.classList.remove('show'), 1200);
    });
    lab.append(span, sel);
    return lab;
  };
  const advRow = document.createElement('div');
  advRow.className = 'adv-flex advrow';
  advRow.append(
    mkSel('bucket', ['', ...bucketList], extras.bucket, 'bucket'),
    mkSel('tag', ['character', 'scene', 'style'], extras.tag, 'tag'),
  );
  card.appendChild(advRow);

  // row 1: properties (left) | description (right)
  const pair1 = document.createElement('div');
  pair1.className = 'pair';
  const props = document.createElement('div');
  props.className = 'props';
  const desc = document.createElement('div');
  desc.className = 'desc';
  fillCardMeta(props, desc, meta);
  pair1.append(props, desc);

  // row 2: negatives (red) | positives (green), each with copy buttons
  const pair2 = document.createElement('div');
  pair2.className = 'pair';
  const parts = commentParts(comments[key]);

  // auto-save: every keystroke, 500ms debounce; blur flushes immediately
  let dirty = false;
  const scheduleSave = () => {
    dirty = true;
    clearTimeout(saveTimers[key]);
    saveTimers[key] = setTimeout(flushSave, 500);
  };
  const flushSave = () => {
    if (!dirty) return;
    dirty = false;
    clearTimeout(saveTimers[key]);
    saveComment(key, negTa.value, posTa.value, savedEl);
  };

  // First neighbor WITH CONTENT in that direction (skips empty neighbors,
  // rendered or not). Rendered neighbor: copy its live textarea (may hold
  // unsaved edits). Hidden/not-yet-rendered: copy its stored feedback.
  const copyFrom = (dir, cls, ta) => {
    const step = dir === 'next' ? 1 : -1;
    for (let i = idx + step; i >= 0 && i < allFiles.length; i += step) {
      const nCard = cardEls[i];
      let text = '';
      if (nCard) {
        const src = nCard.querySelector(`textarea.${cls}`);
        text = src ? src.value : '';
      } else {
        const p = commentParts(comments[`${currentHost}:${allFiles[i]}`]);
        text = cls === 'neg' ? p.neg : p.pos;
      }
      if (text) {
        ta.value = text;
        scheduleSave();
        return;
      }
    }
  };

  const mkBoxCol = (cls, placeholder, initial) => {
    const col = document.createElement('div');
    col.className = 'boxcol';
    const ta = document.createElement('textarea');
    ta.className = cls;
    ta.placeholder = placeholder;
    ta.value = initial;
    ta.addEventListener('input', scheduleSave);
    ta.addEventListener('blur', flushSave);
    const row = document.createElement('div');
    row.className = 'btnrow';
    const belowBtn = document.createElement('button');
    belowBtn.textContent = 'copy from below';
    belowBtn.addEventListener('click', () => copyFrom('next', cls, ta));
    const aboveBtn = document.createElement('button');
    aboveBtn.textContent = 'copy from above';
    aboveBtn.addEventListener('click', () => copyFrom('previous', cls, ta));
    row.append(belowBtn, aboveBtn);
    col.append(ta, row);
    return { col, ta };
  };

  const neg = mkBoxCol('neg', 'negatives…', parts.neg);
  const pos = mkBoxCol('pos', 'positives…', parts.pos);
  const negTa = neg.ta;
  const posTa = pos.ta;
  pair2.append(neg.col, pos.col);
  card.appendChild(pair2);       // feedback boxes right under label/thumbs/save
  card.appendChild(pair1);       // properties + description below
  return card;
}

// Remove a rendered card from the list (verdict storage is the caller's job).
function removeCard(idx) {
  const card = cardEls[idx];
  if (card) {
    listObserver.unobserve(card);
    visibleSet.delete(idx);
    loadedSet.delete(idx);
    card.remove();
    cardEls[idx] = undefined;
  }
  setStatus(statusSummary());
}

async function saveComment(key, neg, pos, savedEl) {
  const [host, ...rest] = key.split(':');
  try {
    await fetch('/api/comments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ host, file: rest.join(':'), neg, pos }),
    });
    // merge locally, preserving any vote (server does a partial update)
    const e = (comments[key] && typeof comments[key] === 'object')
      ? { ...comments[key] } : {};
    e.neg = neg;
    e.pos = pos;
    if (!neg.trim() && !pos.trim() && !e.vote) delete comments[key];
    else comments[key] = e;
    savedEl.classList.add('show');
    setTimeout(() => savedEl.classList.remove('show'), 1200);
  } catch (err) {
    setStatus(`comment save failed: ${err.message}`, true);
  }
}

// ---------- lightbox ----------
// Design: ONE state object (S) is the source of truth; render() is the
// only function that writes the DOM. View pan units are FRACTIONS of the
// displayed image box (unit-free per-image persistence — no offsetWidth /
// naturalWidth conversions in state math). Feature flags via LS helpers.
//
// External contract (used by the rest of the page):
//   LB.open(src, sourceImg)  — open the lightbox on an image
//   LB.render()              — re-apply state to the DOM
//   LB.setView(v)            — set the current view + persist to the image
//   LB.current()             — current entry {key, src, el, nw, nh}
//   LB.anchorCurrent()       — current anchor entry (same shape) or null
//   LB.boxFor(nw, nh)        — the lightbox display box for a natural size
//   refreshFaceBox()         — (re)detect + draw the face overlay for the
//                              current image (called by the detection init)
//   guidesVisible() / applyGuidesVisibility() — guide visibility toggle

const LS_ZOOM = 'kosmozoo.zoom.v2';   // {key: {s, txf, tyf, fh, fv, rot}}
localStorage.removeItem('kosmozoo.zoom.v1');  // px-unit states, incompatible
const LS_GUIDES = 'kosmozoo.guides.v1';       // [{axis, pos}]
const LS_GUIDES_VIS = 'kosmozoo.guides.visible';
const LS_OVERLAY = 'kosmozoo.lightbox.overlay';
const LS_SPLIT = 'kosmozoo.split';
const LS_LINKED = 'kosmozoo.lightbox.linked';

// --- elements (bare names for compatibility with the rest of the page) ---
const lightbox = $('lightbox');
const lbImg = $('lbImg'), lbBase = $('lbBase'), lbPrev = $('lbPrev');
const lbClipWrap = $('lbClipWrap');
const lbFaceBoxEl = $('faceBox');
const lbGuideLayer = $('guideLayer');
const lbStripTop = $('guideStripTop'), lbStripLeft = $('guideStripLeft');
const lbMixWrap = $('lbMixWrap'), lbMix = $('lbMix'), lbMixVal = $('lbMixVal');
const lbSplitEl = $('lbSplit');
const lbAnchorTag = $('lbAnchorTag');
const lbFlipH = $('lbFlipH'), lbFlipV = $('lbFlipV');

// --- state (single source of truth) ---
const S = {
  open: false,
  view: null,          // {scale, txf, tyf, fh, fv, rot}; pan in box fractions
  col: 'cand',         // 'cand' | 'anchor'
  pos: { cand: 0, anchor: 0 },
  entry: null,         // current {key, src, el, nw, nh}
  mix: 100,            // candidate opacity % over the current anchor
  splitX: null,        // split-wipe line, viewport px; null = off
  splitPending: false, // toggle-on deferred until image dims are known
  faceBox: null,       // detection for the current image
  dragMoved: 0,        // click-vs-drag disambiguation
};

function lbFreshView() { return { scale: 1, txf: 0, tyf: 0, fh: false, fv: false, rot: 0 }; }
S.view = lbFreshView();

// --- feature flags ---
function overlayOn() { return localStorage.getItem(LS_OVERLAY) !== '0'; } // default on
function splitOn() { return localStorage.getItem(LS_SPLIT) === '1'; }     // default off
// "linked": candidate+anchor share one view — switch keeps it, and
// pan/zoom/flip/rotate apply to both. Default OFF (independent views).
function linkedOn() { return localStorage.getItem(LS_LINKED) === '1'; }
function guidesVisible() { return localStorage.getItem(LS_GUIDES_VIS) !== '0'; }

// --- geometry (the only place px<->fraction conversions exist) ---
function lbBoxFor(nw, nh) {
  const ar = nw / nh;
  const w = Math.min(0.95 * window.innerWidth, 0.95 * window.innerHeight * ar);
  return { w, h: w / ar };
}

// view transform for an image laid out at the given box
function lbTransform(v, box) {
  const sx = v.fh ? -1 : 1, sy = v.fv ? -1 : 1;
  return `translate(-50%,-50%) rotate(${v.rot}deg) ` +
         `scale(${v.scale * sx}, ${v.scale * sy}) ` +
         `translate(${v.txf * box.w}px, ${v.tyf * box.h}px)`;
}

// image fraction -> screen px under view+box (evaluated at rotation=0;
// overlays take the rotation themselves)
function lbMapFrac(v, box, fx, fy) {
  const sx = v.fh ? -1 : 1, sy = v.fv ? -1 : 1;
  return [
    window.innerWidth / 2 + v.scale * sx * ((fx - 0.5 + v.txf) * box.w),
    window.innerHeight / 2 + v.scale * sy * ((fy - 0.5 + v.tyf) * box.h),
  ];
}

// image center on screen = rotation pivot (V + R·S·t)
function lbPivotScreen(v, box) {
  const sx = v.fh ? -1 : 1, sy = v.fv ? -1 : 1;
  const rad = v.rot * Math.PI / 180;
  const tx = v.scale * sx * v.txf * box.w, ty = v.scale * sy * v.tyf * box.h;
  return [window.innerWidth / 2 + Math.cos(rad) * tx - Math.sin(rad) * ty,
          window.innerHeight / 2 + Math.sin(rad) * tx + Math.cos(rad) * ty];
}

// screen-px drag delta -> view fraction delta (inverse of the display
// transform), so pans stay pointer-true under rotation/flips
function lbPanFrac(dx, dy) {
  const rad = -S.view.rot * Math.PI / 180;
  const c = Math.cos(rad), s = Math.sin(rad);
  const rx = dx * c - dy * s, ry = dx * s + dy * c;
  const box = lbCurrentBox() || { w: window.innerWidth, h: window.innerHeight };
  const sx = S.view.fh ? -1 : 1, sy = S.view.fv ? -1 : 1;
  return [rx / (S.view.scale * sx * box.w), ry / (S.view.scale * sy * box.h)];
}

function lbCurrentBox() {
  const nw = (S.entry && S.entry.nw) || lbImg.naturalWidth;
  const nh = (S.entry && S.entry.nh) || lbImg.naturalHeight;
  return nw ? lbBoxFor(nw, nh) : null;
}

// ---------- per-image state (unit-free, persisted) ----------

const zoomStore = (() => {
  try { return JSON.parse(localStorage.getItem(LS_ZOOM)) || {}; }
  catch (e) { return {}; }
})();
let zoomPersistTimer = null;
function persistZoomStore() {
  clearTimeout(zoomPersistTimer);
  zoomPersistTimer = setTimeout(() => {
    try { localStorage.setItem(LS_ZOOM, JSON.stringify(zoomStore)); }
    catch (e) { /* in-memory only */ }
  }, 300);
}

function saveZoomKey(key, state) {
  if (!key) return;
  if (state && (state.s > 1 || state.fh || state.fv || state.rot ||
                state.txf || state.tyf))
    zoomStore[key] = { s: state.s, txf: state.txf || 0, tyf: state.tyf || 0,
                       fh: !!state.fh, fv: !!state.fv, rot: state.rot || 0 };
  else delete zoomStore[key];
  persistZoomStore();
}

// inline image element <-> view state. Element is the live store;
// zoomStore is the persistent copy. State shape:
// { s, txf, tyf, fh, fv, rot } — or absent when untouched.
function readImageState(img) {
  const z = img && img._zoomState;
  if (!z) return null;
  if (z.s <= 1 && !z.txf && !z.tyf && !z.fh && !z.fv && !z.rot) return null;
  return { scale: z.s, txf: z.txf || 0, tyf: z.tyf || 0,
           fh: !!z.fh, fv: !!z.fv, rot: z.rot || 0 };
}
function writeImageState(img, v) {
  if (!img || !img._setZoom) return;
  img._setZoom({ s: v.scale, txf: v.txf, tyf: v.tyf,
                 fh: v.fh, fv: v.fv, rot: v.rot });
}


// ---------- inline pinch zoom (candidates + anchors, fraction units) ----------

function makeZoomable(img, hooks = {}) {
  let scale = 1, txf = 0, tyf = 0;
  const apply = () => {
    if (scale <= 1.001) { scale = 1; txf = 0; tyf = 0; }
    img._zoomState = { ...img._zoomState, s: scale, txf, tyf };
    if (scale === 1 && !txf && !tyf) {
      img.style.transform = '';
      img.classList.remove('zoomed');
    } else {
      img.style.transform =
        `translate(${txf * img.offsetWidth}px, ${tyf * img.offsetHeight}px) ` +
        `scale(${scale})`;
      img.classList.add('zoomed');
    }
    if (hooks.zoomKey) saveZoomKey(hooks.zoomKey, img._zoomState);
    if (hooks.onZoomChange) hooks.onZoomChange(scale > 1);
  };
  img._setZoom = (z) => {
    img._zoomState = { ...img._zoomState, ...z };
    scale = img._zoomState.s ?? 1;
    txf = img._zoomState.txf || 0;
    tyf = img._zoomState.tyf || 0;
    apply();
  };
  img.addEventListener('wheel', (e) => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.012);
    const newScale = Math.min(12, Math.max(1, scale * factor));
    if (newScale === scale) return;
    const r = img.parentElement.getBoundingClientRect();
    const ox = r.left + r.width / 2, oy = r.top + r.height / 2;
    const k = 1 - newScale / scale;
    txf += k * ((e.clientX - ox) / r.width - txf);
    tyf += k * ((e.clientY - oy) / r.height - tyf);
    scale = newScale;
    apply();
  }, { passive: false });
  img.addEventListener('pointerdown', (e) => {
    if (scale <= 1) return;
    e.preventDefault();
    img.setPointerCapture(e.pointerId);
    let lx = e.clientX, ly = e.clientY;
    const move = (ev) => {
      txf += (ev.clientX - lx) / (scale * img.offsetWidth);
      tyf += (ev.clientY - ly) / (scale * img.offsetHeight);
      lx = ev.clientX; ly = ev.clientY;
      apply();
    };
    const up = () => {
      img.removeEventListener('pointermove', move);
      img.removeEventListener('pointerup', up);
      img.removeEventListener('pointercancel', up);
    };
    img.addEventListener('pointermove', move);
    img.addEventListener('pointerup', up);
    img.addEventListener('pointercancel', up);
  });
  // swallow the click that ends a pan-drag (so it doesn't open the lightbox)
  let dragMoved = 0;
  img.addEventListener('pointerdown', () => { dragMoved = 0; }, true);
  img.addEventListener('pointermove', (e) => {
    if (scale > 1) dragMoved += 1;
  }, true);
  img.addEventListener('click', (e) => {
    if (dragMoved > 5) { e.stopImmediatePropagation(); e.preventDefault(); dragMoved = 0; }
  }, true);
  img.addEventListener('dblclick', (e) => { e.preventDefault(); scale = 1; txf = tyf = 0; apply(); });
  img.draggable = false;
}

// ---------- the one render path ----------

function render() {
  // pending split activation: wait for image dims so the line can start
  // at the image's edge instead of the viewport center
  if (S.splitPending && lbCurrentBox()) {
    S.splitPending = false;
    S.splitX = lbImageLeftEdge();
  }
  updateToggleStates();
  const box = lbCurrentBox();
  if (box) lbImg.style.transform = lbTransform(S.view, box);
  lbFlipH.classList.toggle('on', S.view.fh);
  lbFlipV.classList.toggle('on', S.view.fv);

  // underlay + comparison stack (candidates only, overlay mode on)
  const anchors = lbListEntries('anchor');
  const showOverlay = S.open && overlayOn() && S.col === 'cand' &&
                      anchors.length > 0;
  const wipeOn = showOverlay && splitOn();
  lbMixWrap.style.display = showOverlay ? 'flex' : 'none';
  lbSplitEl.style.display = wipeOn ? 'block' : 'none';
  lbAnchorTag.style.display = S.open && S.col === 'anchor' ? 'block' : 'none';
  if (showOverlay) {
    const a = anchors[Math.min(S.pos.anchor, anchors.length - 1)];
    if (lbBase.getAttribute('src') !== a.src) lbBase.src = a.src;
    // underlay: the shared current view when linked, the anchor's own
    // stored view when independent
    const av = linkedOn() ? S.view
                          : (a.el && readImageState(a.el)) || lbFreshView();
    const abox = a.nw ? lbBoxFor(a.nw, a.nh) : null;
    if (abox) lbBase.style.transform = lbTransform(av, abox);
    lbImg.style.opacity = S.mix / 100;
    lbMixVal.textContent = S.mix + '%';
  } else {
    lbBase.removeAttribute('src');
    lbImg.style.opacity = '';
  }
  lbSplitEl.style.left =
    (S.splitX == null ? window.innerWidth / 2 : S.splitX) + 'px';
  lbClipWrap.style.clipPath =
    (wipeOn && S.splitX != null) ? `inset(0 0 0 ${S.splitX}px)` : '';

  renderFaceBox();
}

// ---------- image pipeline (the only place src changes hands) ----------

let lbLoadGen = 0;

// Set the current entry and show it: outgoing image covers the swap until
// the incoming one has actually loaded (no blink, no stale-dims placement).
function lbShow(entry) {
  const outgoing = S.entry;
  if (outgoing && outgoing.el) writeImageState(outgoing.el, S.view);
  if (outgoing && lbImg.getAttribute('src') && lbImg.naturalWidth) {
    lbPrev.src = lbImg.getAttribute('src');
    const obox = outgoing.nw ? lbBoxFor(outgoing.nw, outgoing.nh)
        : lbBoxFor(lbImg.naturalWidth, lbImg.naturalHeight);
    if (obox) lbPrev.style.transform = lbTransform(S.view, obox);
    lbPrev.style.opacity = lbImg.style.opacity;
    lbPrev.style.display = 'block';
  }
  S.entry = entry;
  S.faceBox = null;
  const gen = ++lbLoadGen;
  lbImg.src = entry.src;
  // dims: known from metadata/detection/prior load -> place immediately;
  // otherwise place when this src has actually finished loading
  if (!entry.nw && entry.el && entry.el.naturalWidth) {
    entry.nw = entry.el.naturalWidth;
    entry.nh = entry.el.naturalHeight;
  }
  if (entry.nw) {
    render();
  } else {
    lbImg.style.transform = '';   // CSS fallback centers it unscaled
    render();                     // underlay/facebox/etc. update
    const onload = () => {
      if (gen !== lbLoadGen) return;
      if (lbImg.getAttribute('src') !== entry.src) return;
      entry.nw = lbImg.naturalWidth;
      entry.nh = lbImg.naturalHeight;
      render();
    };
    lbImg.addEventListener('load', onload, { once: true });
    lbImg.addEventListener('error', onload, { once: true });  // show broken, not stuck
  }
  refreshFaceBox();
}

lbImg.addEventListener('load', () => { lbUncover(); });
lbImg.addEventListener('error', () => lbUncover());

function lbUncover() {
  lbPrev.style.display = 'none';
  lbPrev.removeAttribute('src');
}

// ---------- column model ----------

function lbListEntries(col) {
  return col === 'cand'
    ? [...candidatesEl.querySelectorAll('.card')].map(c => {
        const img = c.querySelector('img');
        return { key: `${currentHost}:${c.dataset.name}`,
                 src: c.dataset.imgUrl, img: img, el: img,
                 nw: c.dataset.nw ? +c.dataset.nw : (img && img.naturalWidth) || 0,
                 nh: c.dataset.nh ? +c.dataset.nh : (img && img.naturalHeight) || 0 };
      })
    : [...anchorList.querySelectorAll('.anchor')].map(a => {
        const img = a.querySelector('img');
        return { key: `anchor:${a.dataset.name}`, src: a.dataset.src,
                 img: img, el: img,
                 nw: (img && img.naturalWidth) || 0,
                 nh: (img && img.naturalHeight) || 0 };
      });
}

function lbLocate(sourceImg) {
  const cards = lbListEntries('cand');
  const ci = cards.findIndex(e => e.img === sourceImg);
  if (ci >= 0) { S.col = 'cand'; S.pos.cand = ci; return cards[ci]; }
  const anchors = lbListEntries('anchor');
  const ai = anchors.findIndex(e => e.img === sourceImg);
  if (ai >= 0) { S.col = 'anchor'; S.pos.anchor = ai; return anchors[ai]; }
  S.col = 'cand'; S.pos.cand = 0;
  return cards[0];
}

// When linked, the counterpart's stored view follows every view change
// (one shared frame for the pair). Views are unit-free (fractions), so the
// same object fits both images.
function lbCounterpartEntry() {
  const col = S.col === 'cand' ? 'anchor' : 'cand';
  const list = lbListEntries(col);
  if (!list.length) return null;
  return list[Math.min(S.pos[col], list.length - 1)];
}

// ---------- navigation ----------

function lbNavigate(dCol, dRow) {
  let col = S.col, idx = S.pos[S.col];
  if (dCol === 1) {
    if (col !== 'cand' || !lbListEntries('anchor').length) return;
    col = 'anchor';
    idx = Math.min(S.pos.anchor, lbListEntries('anchor').length - 1);
  } else if (dCol === -1) {
    if (col !== 'anchor') return;
    col = 'cand';
    idx = Math.min(S.pos.cand, lbListEntries('cand').length - 1);
  } else if (dRow) {
    let list = lbListEntries(col);
    if (col === 'cand' && idx + dRow >= list.length - 1 &&
        viewPos < viewFiles.length) {
      renderChunk();
      list = lbListEntries(col);
    }
    const n = Math.max(0, Math.min(list.length - 1, idx + dRow));
    if (n === idx) return;
    idx = n;
  } else return;

  S.col = col;
  S.pos[col] = idx;
  const entry = lbListEntries(col)[idx];

  // ORDER MATTERS: lbShow writes back the OUTGOING image's state from the
  // CURRENT S.view; only after that may S.view change to the incoming one.
  const align = faceAlignOn() && col === 'cand' && faceLoadState === 'ready';
  const share = dCol && linkedOn() &&
                !(faceAlignOn() && faceLoadState === 'ready');
  const nextView = share ? S.view
                         : (readImageState(entry.el) || lbFreshView());
  lbShow(entry);          // write-back + cover + src swap (old view)
  S.view = nextView;      // now the incoming image's view
  render();
  if (align) alignToAnchorFace();   // overrides the fallback when it can
}

// ---------- open/close ----------

function openLightbox(src, sourceImg) {
  lbUncover();
  const entry = lbLocate(sourceImg);
  S.open = true;
  lightbox.classList.add('open');
  if (!S._guidesRestored) {
    S._guidesRestored = true;
    restoreGuides();
  }
  updateFaceTogglesVisibility();
  S.view = readImageState(entry.el) || lbFreshView();
  if (faceAlignOn() && S.col === 'cand' && faceLoadState === 'ready') {
    lbShow(entry);
    alignToAnchorFace();
  } else {
    lbShow(entry);
  }
  render();
}

function closeLightbox() {
  if (S.entry && S.entry.el) writeImageState(S.entry.el, S.view);
  S.open = false;
  S.entry = null;
  S.faceBox = null;
  lightbox.classList.remove('open');
  lbUncover();
  lbImg.removeAttribute('src');
  lbBase.removeAttribute('src');
  lbImg.style.opacity = '';
  lbMixWrap.style.display = 'none';
  lbAnchorTag.style.display = 'none';
  renderFaceBox();
}

// ---------- input ----------

function lbApplyView(persist = true) {
  if (persist && S.entry && S.entry.el) writeImageState(S.entry.el, S.view);
  if (persist && linkedOn()) {
    const other = lbCounterpartEntry();
    if (other && other.el) writeImageState(other.el, S.view);
  }
  render();
}

$('lbClose').addEventListener('click', closeLightbox);

document.addEventListener('keydown', (e) => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  // Alt+Left/Right: split-wipe line (10px; +Shift = 1px)
  else if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    e.preventDefault();
    if (S.splitX == null) S.splitX = window.innerWidth / 2;
    const step = (e.shiftKey ? 1 : 10) * (e.key === 'ArrowRight' ? 1 : -1);
    S.splitX = Math.max(0, Math.min(window.innerWidth, S.splitX + step));
    render();
  }
  // Shift+arrows: pan 1 screen px (direction-true under rotation/flip)
  else if (e.shiftKey && e.key.startsWith('Arrow')) {
    e.preventDefault();
    const d = e.key === 'ArrowRight' ? [1, 0] : e.key === 'ArrowLeft'
      ? [-1, 0] : e.key === 'ArrowDown' ? [0, 1] : [0, -1];
    const [dtx, dty] = lbPanFrac(d[0], d[1]);
    S.view.txf += dtx;
    S.view.tyf += dty;
    lbApplyView();
  }
  // H/V: flip
  else if (!e.ctrlKey && !e.altKey && !e.metaKey &&
           (e.key === 'h' || e.key === 'H' || e.key === 'v' ||
            e.key === 'V')) {
    e.preventDefault();
    lbToggleFlip(e.key.toLowerCase());
  }
  // -/+: zoom so the displayed image width changes by 1px (10 with Shift)
  else if (e.key === '-' || e.key === '_' || e.key === '=' ||
           e.key === '+') {
    e.preventDefault();
    const box = lbCurrentBox();
    const boxW = (box && box.w) || 1;
    const dir = (e.key === '-' || e.key === '_') ? -1 : 1;
    const step = (e.shiftKey ? 10 : 1) * dir;
    const factor = Math.max(0.5, boxW + step) / boxW;
    S.view.scale = Math.min(12, Math.max(0.2, S.view.scale * factor));
    lbApplyView();
  }
  else if (e.key === 'ArrowRight') { e.preventDefault(); lbNavigate(1, 0); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); lbNavigate(-1, 0); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); lbNavigate(0, 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); lbNavigate(0, -1); }
});

function lbToggleFlip(axis) {
  if (axis === 'h') S.view.fh = !S.view.fh;
  else S.view.fv = !S.view.fv;
  lbApplyView();
}

// wheel: ctrl+wheel (trackpad pinch) zooms; plain scroll does nothing
lightbox.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (!e.ctrlKey) return;
  const factor = Math.exp(-e.deltaY * 0.01);
  S.view.scale = Math.min(12, Math.max(0.2, S.view.scale * factor));
  lbApplyView();
}, { passive: false });

// pointer: drag = pan (linked when matched or Shift held), Alt+drag =
// rotate about the image center (snaps to 0° within 4°)
const lbPointers = new Map();
let lbPinchDist = 0;

lbImg.addEventListener('pointerdown', (e) => {
  S.dragMoved = 0;
  lbImg.setPointerCapture(e.pointerId);
  if (e.altKey) {
    e.preventDefault();
    const box = lbCurrentBox();
    if (!box) return;
    const piv = lbPivotScreen(S.view, box);
    const a0 = Math.atan2(e.clientY - piv[1], e.clientX - piv[0]);
    const r0 = S.view.rot;
    const move = (ev) => {
      const a = Math.atan2(ev.clientY - piv[1], ev.clientX - piv[0]);
      const d = (a - a0) * 180 / Math.PI;
      if (Math.abs(d) > 0.5) S.dragMoved = 10;
      let rot = r0 + d;
      const snapped = Math.round(rot / 360) * 360;
      if (Math.abs(rot - snapped) < 4) rot = snapped;
      S.view.rot = rot;
      lbApplyView();
    };
    const up = () => {
      lbImg.removeEventListener('pointermove', move);
      lbImg.removeEventListener('pointerup', up);
      lbImg.removeEventListener('pointercancel', up);
    };
    lbImg.addEventListener('pointermove', move);
    lbImg.addEventListener('pointerup', up);
    lbImg.addEventListener('pointercancel', up);
    return;
  }
  lbPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  lbImg.classList.add('dragging');
  if (lbPointers.size === 2) {
    const [a, b] = [...lbPointers.values()];
    lbPinchDist = Math.hypot(a.x - b.x, a.y - b.y);
  }
});

lbImg.addEventListener('pointermove', (e) => {
  if (!lbPointers.has(e.pointerId)) return;
  const prev = lbPointers.get(e.pointerId);
  lbPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (lbPointers.size === 1) {
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    const linked = linkedOn() || e.shiftKey;
    const box = lbCurrentBox() || { w: window.innerWidth, h: window.innerHeight };
    if (linked || S.view.rot || S.view.fh || S.view.fv) {
      const [dtx, dty] = lbPanFrac(dx, dy);
      S.view.txf += dtx;
      S.view.tyf += dty;
    } else {
      S.view.txf += dx / (S.view.scale * box.w);
      S.view.tyf += dy / (S.view.scale * box.h);
    }
    // when linked, lbApplyView persists the shared view to BOTH images
    S.dragMoved += Math.abs(dx) + Math.abs(dy);
  } else if (lbPointers.size === 2) {
    const [a, b] = [...lbPointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (lbPinchDist > 0)
      S.view.scale = Math.min(12, Math.max(0.2, S.view.scale * (d / lbPinchDist)));
    lbPinchDist = d;
  }
  lbApplyView();
});
const lbPointerEnd = (e) => {
  lbPointers.delete(e.pointerId);
  if (!lbPointers.size) lbImg.classList.remove('dragging');
  lbPinchDist = 0;
};
lbImg.addEventListener('pointerup', lbPointerEnd);
lbImg.addEventListener('pointercancel', lbPointerEnd);

// click closes (not the click ending a drag/rotate)
lbImg.addEventListener('click', () => {
  if (S.dragMoved > 5) { S.dragMoved = 0; return; }
  closeLightbox();
});

// ---------- underlay extras (slider / split drag / flips) ----------

lbMix.addEventListener('input', (e) => {
  S.mix = Number(e.target.value);
  render();
});

$('lbFlipH').addEventListener('click', () => lbToggleFlip('h'));
$('lbFlipV').addEventListener('click', () => lbToggleFlip('v'));

lbSplitEl.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  e.stopPropagation();
  lbSplitEl.setPointerCapture(e.pointerId);
  if (S.splitX == null) S.splitX = window.innerWidth / 2;
  const move = (ev) => {
    S.splitX = Math.max(0, Math.min(window.innerWidth, ev.clientX));
    render();
  };
  const up = (ev) => {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    if (ev.clientX <= 4 || ev.clientX >= window.innerWidth - 4) {
      S.splitX = null;
      render();
    }
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
});

// split toggle: starts at the image's left edge (candidate fully visible)
function lbImageLeftEdge() {
  const box = lbCurrentBox();
  if (!box) return window.innerWidth / 2;
  const e0 = lbMapFrac(S.view, box, 0, 0.5)[0];
  const e1 = lbMapFrac(S.view, box, 1, 0.5)[0];
  return Math.min(e0, e1);
}

// ---------- facebox overlay ----------

const LS_FACEBOX_VIS = 'kosmozoo.facebox.visible';   // default on
function faceBoxVisible() {
  return localStorage.getItem(LS_FACEBOX_VIS) !== '0';
}


function updateFaceBoxOverlay() { renderFaceBox(); }   // compat alias

function renderFaceBox() {
  const el = lbFaceBoxEl;
  if (!S.open || !S.faceBox || faceLoadState !== 'ready' || !faceBoxVisible()) {
    el.style.display = 'none';
    return;
  }
  const box = lbCurrentBox();
  if (!box) { el.style.display = 'none'; return; }
  const fb = S.faceBox;
  const [l0, t0] = lbMapFrac(S.view, box, fb.x, fb.y);
  const [r0, b0] = lbMapFrac(S.view, box, fb.x + fb.w, fb.y + fb.h);
  const left = Math.min(l0, r0), top = Math.min(t0, b0);
  el.style.display = 'block';
  el.style.left = left + 'px';
  el.style.top = top + 'px';
  el.style.width = Math.abs(r0 - l0) + 'px';
  el.style.height = Math.abs(b0 - t0) + 'px';
  const [pivX, pivY] = lbPivotScreen(S.view, box);
  el.style.transformOrigin = `${pivX - left}px ${pivY - top}px`;
  el.style.transform = `rotate(${S.view.rot}deg)`;
  if (!el._eyeDots) {
    el._eyeDots = [0, 1].map(() => {
      const d = document.createElement('span');
      d.className = 'eye';
      el.appendChild(d);
      return d;
    });
  }
  const eyes = faceFrame(fb).eyes;
  el._eyeDots.forEach((d, i) => {
    d.style.display = eyes ? 'block' : 'none';
    if (eyes) {
      const [ex, ey] = lbMapFrac(S.view, box, eyes[i][0], eyes[i][1]);
      d.style.left = (ex - left) + 'px';
      d.style.top = (ey - top) + 'px';
    }
  });
}

async function refreshFaceBox() {
  S.faceBox = null;
  renderFaceBox();
  if (faceLoadState !== 'ready' || !S.entry) return;
  const entry = S.entry;
  const box = await detectFaceBox(entry);
  if (S.entry !== entry) return;
  S.faceBox = box;
  renderFaceBox();
}

// ---------- guides ----------

function persistGuides() {
  const items = [...lbGuideLayer.querySelectorAll('.guide')].map(g => ({
    axis: g.classList.contains('h') ? 'h' : 'v',
    pos: parseFloat(g.classList.contains('h') ? g.style.top : g.style.left) +
           6,   // undo the visual-centering offset
  }));
  try { localStorage.setItem(LS_GUIDES, JSON.stringify(items)); }
  catch (e) { /* in-memory only */ }
}

function restoreGuides() {
  let items = [];
  try { items = JSON.parse(localStorage.getItem(LS_GUIDES)) || []; }
  catch (e) { /* none */ }
  for (const it of items) {
    if (it && (it.axis === 'h' || it.axis === 'v') && isFinite(it.pos))
      addGuide(it.axis, it.pos);
  }
}

function applyGuidesVisibility() {
  lightbox.classList.toggle('guides-hidden', !guidesVisible());
}

function addGuide(axis, pos) {
  const g = document.createElement('div');
  g.className = `guide ${axis}`;
  g._setPos = (p) => {
    const max = axis === 'h' ? lightbox.clientHeight : lightbox.clientWidth;
    pos = Math.max(0, Math.min(max, p));
    // padded grab area is wider than the visible line; keep the visible
    // line centered on the pointer position
    if (axis === 'h') g.style.top = (pos - 6) + 'px';
    else g.style.left = (pos - 6) + 'px';
  };
  g._setPos(pos);
  g.addEventListener('dblclick', (e) => {
    e.stopPropagation();
    g.remove();
    persistGuides();
  });
  g.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    g.setPointerCapture(e.pointerId);
    const move = (ev) => g._setPos(axis === 'h' ? ev.clientY : ev.clientX);
    const up = (ev) => {
      g.removeEventListener('pointermove', move);
      g.removeEventListener('pointerup', up);
      g.removeEventListener('pointercancel', up);
      const p = axis === 'h' ? ev.clientY : ev.clientX;
      if (p < 6) g.remove();   // dragged back off the creating edge
      persistGuides();
    };
    g.addEventListener('pointermove', move);
    g.addEventListener('pointerup', up);
    g.addEventListener('pointercancel', up);
  });
  lbGuideLayer.appendChild(g);
  persistGuides();
  return g;
}

for (const [strip, axis] of [[lbStripTop, 'h'], [lbStripLeft, 'v']]) {
  strip.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const g = addGuide(axis, axis === 'h' ? e.clientY : e.clientX);
    const move = (ev) => g._setPos(axis === 'h' ? ev.clientY : ev.clientX);
    const up = (ev) => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      const p = axis === 'h' ? ev.clientY : ev.clientX;
      if (p < 6) g.remove();
      persistGuides();
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  });
}

// ---------- public API used elsewhere in the page ----------

const LB = {
  open: openLightbox,
  close: closeLightbox,
  render,
  applyView: lbApplyView,
  toggleFlip: lbToggleFlip,
  // state accessors for the detection/alignment section
  current: () => S.entry,
  currentCol: () => S.col,
  anchorEntry: () => {
    const anchors = lbListEntries('anchor');
    return anchors.length
      ? anchors[Math.min(S.pos.anchor, anchors.length - 1)] : null;
  },
  anchorView: () => {
    const a = LB.anchorEntry();
    return (a && readImageState(a.el)) || lbFreshView();
  },
  setView(v) { S.view = { ...lbFreshView(), ...v }; lbApplyView(); },
  view: () => S.view,
  boxFor: lbBoxFor,
  mapFrac: lbMapFrac,
  isOpen: () => S.open,
  splitSetX(x) { S.splitX = x; render(); },
  setSplitOn(on) {
    try { localStorage.setItem(LS_SPLIT, on ? '1' : '0'); } catch (e) {}
    if (on && !lbCurrentBox()) {
      S.splitPending = true;      // apply at the image edge once dims land
      S.splitX = null;
    } else {
      S.splitPending = false;
      S.splitX = on ? lbImageLeftEdge() : null;
    }
    render();
  },
  mixSet(v) { S.mix = v; render(); },
};
// ---------- face detection (opt-in, lazy-loaded; MediaPipe BlazeFace) ----------

const LS_FACE = 'kosmozoo.faceDetect.enabled';
const LS_ALIGN = 'kosmozoo.faceAlign';
const LS_FACEBOXES = 'kosmozoo.faceBoxes.v3';  // { "model:key": box|null }
const LS_FACEMODEL = 'kosmozoo.faceDetect.model';  // 'anime' (default) | 'mp'
localStorage.removeItem('kosmozoo.faceBoxes.v1');  // superseded schemas
localStorage.removeItem('kosmozoo.faceBoxes.v2');

let faceDetector = null;   // mp FaceDetector instance, or 'anime' marker
let faceLoadState = 'off';      // off | loading | ready | error

function faceDetectEnabled() { return localStorage.getItem(LS_FACE) === '1'; }
function faceAlignOn() { return localStorage.getItem(LS_ALIGN) === '1'; }
function faceModel() { return localStorage.getItem(LS_FACEMODEL) || 'anime'; }

function faceStatus(msg) { $('menuStatus').textContent = msg; }

// All lightbox toggles stay VISIBLE; ones that can't apply right now get
// greyed + inert instead (never invisibly-active). Face toggles need the
// detector ready; overlay/split need anchors present.
function updateToggleStates() {
  const faceReady = faceDetectEnabled() && faceLoadState === 'ready';
  $('lbAlignWrap').classList.toggle('disabled', !faceReady);
  $('lbFaceBoxWrap').classList.toggle('disabled', !faceReady);
  const hasAnchors = lbListEntries('anchor').length > 0;
  $('lbOverlayWrap').classList.toggle('disabled', !hasAnchors);
  $('lbSplitWrap').classList.toggle('disabled',
    !hasAnchors || S.col !== 'cand');
}
// compat: detection init calls this name
function updateFaceTogglesVisibility() { updateToggleStates(); }

function importFaceLib() {          // seam for tests
  return import('/vendor/vision_bundle.mjs');
}

async function enableFaceDetection() {
  if (faceLoadState === 'loading' || faceLoadState === 'ready') return;
  faceLoadState = 'loading';
  const model = faceModel();
  faceStatus(model === 'anime'
    ? 'starting local detector…' : 'loading face detector…');
  try {
    if (model === 'anime') {
      // server-side worker (anime-face-detector, torch CPU); blocks until ready
      const resp = await fetch('/api/facebox-warmup');
      if (!resp.ok) {
        const d = await resp.json().catch(() => ({}));
        throw new Error(d.error || resp.status);
      }
      faceDetector = 'anime';
    } else {
      const mp = await importFaceLib();
      const vision = await mp.FilesetResolver.forVisionTasks('/vendor/wasm');
      faceDetector = await mp.FaceDetector.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: '/vendor/blaze_face_short_range.tflite',
        },
        runningMode: 'IMAGE',
      });
    }
    faceLoadState = 'ready';
    faceStatus('ready');
    if (lightbox.classList.contains('open')) refreshFaceBox();
  } catch (err) {
    faceLoadState = 'error';
    faceDetector = null;
    faceStatus('load failed: ' + err.message);
  }
  updateFaceTogglesVisibility();
}

// detection cache (persisted; detect once per image). Nulls are NOT kept:
// they used to poison images permanently when a transient error got cached
// (the beacon/501 incident). Genuine no-face results stay cheap via the
// server-side cache, so re-detecting them client-side is fast.
const faceBoxCache = (() => {
  let raw = {};
  try { raw = JSON.parse(localStorage.getItem(LS_FACEBOXES)) || {}; }
  catch (e) { /* start fresh */ }
  for (const k of Object.keys(raw)) if (raw[k] === null) delete raw[k];
  return raw;
})();
let faceBoxPersistTimer = null;
function persistFaceBoxes() {
  clearTimeout(faceBoxPersistTimer);
  faceBoxPersistTimer = setTimeout(() => {
    try { localStorage.setItem(LS_FACEBOXES, JSON.stringify(faceBoxCache)); }
    catch (e) { /* in-memory only */ }
  }, 300);
}

// entry: {src, key}. Dispatches by selected model; cache keys are
// model-namespaced ("anime:host:file" / "mp:host:file"). Only successful
// detections are cached — errors return null WITHOUT caching (retry next
// time), so a transient failure can never poison an image permanently.
async function detectFaceBox(entry) {
  const key = `${faceModel()}:${entry.key}`;
  if (key in faceBoxCache) return faceBoxCache[key];
  const box = faceModel() === 'anime'
    ? await detectFaceBoxServer(entry)
    : await detectFaceBoxMp(entry);
  if (box) {                      // null = error or no-face: don't cache
    faceBoxCache[key] = box;
    persistFaceBoxes();
  }
  return box;
}

// anime-face-detector via the local server worker (28 landmarks). The
// image bytes always come from the BROWSER (its HTTP cache — the image was
// already downloaded for display), so detection never touches the ComfyUI
// host and can't stall when it's busy generating.
async function detectFaceBoxServer(entry) {
  try {
    const blob = await (await fetch(entry.src)).blob();   // browser cache
    const resp = await fetch(
      `/api/facebox-bytes?key=${encodeURIComponent(entry.key)}`,
      { method: 'POST', body: blob });
    if (!resp.ok) return null;          // transient server/proxy error
    const data = await resp.json();
    return data.box || null;            // null here = genuine "no face found"
  } catch (e) {
    return null;
  }
}

// MediaPipe BlazeFace, client-side (6 keypoints). entry: {src, key}.
async function detectFaceBoxMp(entry) {
  let box = null;
  try {
    const img = new Image();
    img.src = entry.src;
    await img.decode();
    if (img.naturalWidth) {
      const res = faceDetector.detect(img);
      const det = res && res.detections && res.detections[0];
      if (det && det.boundingBox) {
        box = {
          x: det.boundingBox.originX / img.naturalWidth,
          y: det.boundingBox.originY / img.naturalHeight,
          w: det.boundingBox.width / img.naturalWidth,
          h: det.boundingBox.height / img.naturalHeight,
          kps: (det.keypoints || []).map(k =>
            (k.x <= 1 && k.y <= 1)
              ? [k.x, k.y]
              : [k.x / img.naturalWidth, k.y / img.naturalHeight]),
          nw: img.naturalWidth, nh: img.naturalHeight,
        };
      }
    }
  } catch (e) { /* treated as "no face" */ }
  return box;
}

// Anatomical alignment frame: eye midpoint + inter-eye distance in
// height-fraction units. Anime layout (28 pts): eyes are 11-16 and 17-22
// (lid points; center = their mean). BlazeFace (6 pts): 0/1 are the eyes.
// Falls back to box center + box height when no keypoints exist.
function faceFrame(box) {
  const ar = box.nw / box.nh;
  if (box.kps && box.kps.length >= 28) {
    const eyeC = (from, to) => {
      let x = 0, y = 0;
      for (let i = from; i <= to; i++) {
        x += box.kps[i][0];
        y += box.kps[i][1];
      }
      return [x / (to - from + 1), y / (to - from + 1)];
    };
    const [lx, ly] = eyeC(11, 16), [rx, ry] = eyeC(17, 22);
    return { cx: (lx + rx) / 2, cy: (ly + ry) / 2,
             scale: Math.hypot((lx - rx) * ar, ly - ry),
             eyes: [[lx, ly], [rx, ry]] };
  }
  if (box.kps && box.kps.length >= 2) {
    const [rx, ry] = box.kps[0], [lx, ly] = box.kps[1];
    return { cx: (rx + lx) / 2, cy: (ry + ly) / 2,
             scale: Math.hypot((lx - rx) * ar, ly - ry),
             eyes: [[lx, ly], [rx, ry]] };
  }
  return { cx: box.x + box.w / 2, cy: box.y + box.h / 2,
           scale: box.h, eyes: null };
}

// Frame the current candidate so its face matches the current anchor's
// face on screen (position + size). The anchor keeps its own stored view
// as the reference and is never re-framed. Math is in box fractions (the
// lightbox module's units).
async function alignToAnchorFace() {
  if (!faceAlignOn() || faceLoadState !== 'ready' ||
      LB.currentCol() !== 'cand')
    return;
  const aEntry = LB.anchorEntry();
  const cEntry = LB.current();
  if (!aEntry || !cEntry) { setStatus('face align: no anchors'); return; }
  const [aBox, cBox] = await Promise.all(
    [detectFaceBox(aEntry), detectFaceBox(cEntry)]);
  if (LB.current() !== cEntry) return;   // switched meanwhile
  if (!aBox || !cBox) { setStatus('face align: no face found'); return; }

  const av = LB.anchorView();
  const boxA = LB.boxFor(aBox.nw, aBox.nh);
  const boxC = LB.boxFor(cBox.nw, cBox.nh);
  const fA = faceFrame(aBox);
  const fC = faceFrame(cBox);

  // anchor's eyes on screen: center + span; solve the candidate view so
  // its eyes land identically
  const [tx, ty] = LB.mapFrac(av, boxA, fA.cx, fA.cy);
  const span = av.scale * fA.scale * boxA.h;
  const scale = Math.min(12, Math.max(0.2, span / (fC.scale * boxC.h)));
  const v = LB.view();
  const sx = v.fh ? -1 : 1, sy = v.fv ? -1 : 1;
  const txf = (tx - window.innerWidth / 2) / (scale * sx * boxC.w) -
              (fC.cx - 0.5);
  const tyf = (ty - window.innerHeight / 2) / (scale * sy * boxC.h) -
              (fC.cy - 0.5);
  LB.setView({ scale, txf, tyf });
}
